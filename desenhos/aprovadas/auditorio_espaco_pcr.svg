<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Espaço para cadeira de rodas na plateia</title><desc id="d">Vista de cima de fileiras de assentos. O espaço reservado mede 0,80 por 1,20 metro e fica deslocado 0,30 metro em relação ao encosto, com faixa livre de 0,30 metro até a fileira seguinte. Há um assento companheiro ao lado e o Símbolo Internacional de Acesso no piso.</desc>
