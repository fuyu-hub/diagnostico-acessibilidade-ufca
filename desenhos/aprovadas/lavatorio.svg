</text><text x="1010" y="54" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Vista de cima</text><rect x="890" y="114" width="240" height="96" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="1010" cy="160" rx="74" ry="32" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="1010" cy="450" r="240" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3.5" stroke-dasharray="12 8"/><g transform="translate(1010 450) rotate(270) scale(1.05)" opacity="1">
