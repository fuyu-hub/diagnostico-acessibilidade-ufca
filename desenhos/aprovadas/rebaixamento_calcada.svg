<title id="t">Rebaixamento de calçada</title><desc id="d">Calçada rebaixada até o nível da rua. O rebaixo tem largura mínima de 1,20 metro, ideal de 1,50 metro, e declividade máxima de 8,33 por cento, ideal de 5 por cento, sem desnível até a rua. Há piso tátil de alerta no início e no término do rebaixamento.</desc>
