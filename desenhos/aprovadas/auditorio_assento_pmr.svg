<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Assento para PMR e PO no auditório</title><desc id="d">À esquerda, fileiras de um auditório vistas de cima. O assento para pessoa com mobilidade reduzida e pessoa obesa fica junto ao corredor, com espaço livre frontal mínimo de 0,60 metro, em 2 por cento dos assentos ou 1 assento, o que for maior. À direita, o assento visto de lado, com apoio de braço basculante ou removível no lado do corredor.</desc>
