<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Corrimão intermediário</title><desc id="d">Vista de cima de rampa ou escada com 2,40 metros ou mais de largura. Um corrimão intermediário duplo, nas alturas de 0,92 e 0,70 metro, deixa faixa mínima de 1,20 metro de cada lado. Em patamares com mais de 1,40 metro, o corrimão é interrompido, com espaçamento mínimo de 0,80 metro.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="40" y="60" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Vista de cima: rampa ou escada com 2,40 m ou mais de largura</text><rect x="150" y="110" width="420" height="360" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="570" y="110" width="240" height="360" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><rect x="810" y="110" width="420" height="360" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><line x1="150" y1="117" x2="1230" y2="117" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="150" y1="463" x2="1230" y2="463" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="150" y1="290" x2="630" y2="290" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="750" y1="290" x2="1230" y2="290" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="110.0" y1="470.0" x2="110.0" y2="110.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="110.0,470.0 104.9,458.0 115.1,458.0" fill="#1a1a1a"/><polygon points="110.0,110.0 115.1,122.0 104.9,122.0" fill="#1a1a1a"/><line x1="96" y1="470" x2="140" y2="470" stroke="#1a1a1a" stroke-width="1.6" /><line x1="96" y1="110" x2="140" y2="110" stroke="#1a1a1a" stroke-width="1.6" /><text x="94" y="299" font-size="26" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">2,40 m</text><line x1="300.0" y1="282.0" x2="300.0" y2="124.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="300.0,282.0 294.9,270.0 305.1,270.0" fill="#1a1a1a"/><polygon points="300.0,124.0 305.1,136.0 294.9,136.0" fill="#1a1a1a"/><text x="316" y="212" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,20 m</text><line x1="300.0" y1="456.0" x2="300.0" y2="298.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="300.0,456.0 294.9,444.0 305.1,444.0" fill="#1a1a1a"/><polygon points="300.0,298.0 305.1,310.0 294.9,310.0" fill="#1a1a1a"/><text x="316" y="386" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,20 m</text><line x1="630.0" y1="324.0" x2="750.0" y2="324.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="630.0,324.0 639.2,320.1 639.2,327.9" fill="#1a1a1a"/><polygon points="750.0,324.0 740.8,327.9 740.8,320.1" fill="#1a1a1a"/><text x="690" y="362" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,80 m</text><line x1="570.0" y1="500.0" x2="810.0" y2="500.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="570.0,500.0 579.2,496.1 579.2,503.9" fill="#1a1a1a"/><polygon points="810.0,500.0 800.8,503.9 800.8,496.1" fill="#1a1a1a"/><line x1="570" y1="470" x2="570" y2="512" stroke="#1a1a1a" stroke-width="1.6" /><line x1="810" y1="470" x2="810" y2="512" stroke="#1a1a1a" stroke-width="1.6" /><text x="690" y="536" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Patamar acima de 1,40 m</text><text x="690" y="566" font-size="21" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corrimão intermediário interrompido</text><rect x="100" y="600" width="1180" height="120" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="690" y="648" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Corrimão intermediário duplo, nas alturas de 0,92 m e 0,70 m</text><text x="690" y="688" font-size="21" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Alternativa: corrimãos em ambos os lados, mantendo a faixa de passagem</text>
</svg>
