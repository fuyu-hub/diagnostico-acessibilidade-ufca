<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Piso tátil no percurso externo</title><desc id="d">Calçada em perspectiva. O piso tátil direcional, com relevos em linhas, conduz até a entrada. O piso tátil de alerta, com relevos em pontos, marca a mudança de direção, a porta de acesso e o rebaixo de calçada, e também rampas, escadas e obstáculos. O piso é contínuo e contrasta com o piso ao redor.</desc>
