<title id="t">Alturas do bebedouro</title><desc id="d">Parede com dois bebedouros. Um com bica a 0,90 metro, para pessoas em cadeira de rodas e crianças, e altura livre inferior de no mínimo 0,73 metro. Outro com bica entre 1,00 e 1,10 metro, para adultos em pé. O acionamento fica entre 0,80 e 1,20 metro, com área de aproximação frontal de 0,80 por 1,20 metro.</desc>
