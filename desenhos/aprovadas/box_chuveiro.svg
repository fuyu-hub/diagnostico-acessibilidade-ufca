<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Box de chuveiro</title><desc id="d">À esquerda, box visto de cima, com no mínimo 0,90 por 0,95 metro, piso em nível, sem soleira, e inclinação de até 2 por cento para o ralo. À direita, banco articulado ou removível a 0,46 metro do piso, com comprimento mínimo de 0,70 metro e profundidade mínima de 0,45 metro, barra vertical na parede do banco e barras a 90 graus na parede lateral.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="40" y="60" font-size="26" font-weight="700" text-anchor="start" fill="#1a1a1a" >Vista de cima</text><rect x="215" y="170" width="342" height="361" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="6"/><rect x="215" y="210" width="171" height="266" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><text x="300.5" y="343" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Banco</text><circle cx="497" cy="471" r="20" fill="#888" stroke="#1a1a1a" stroke-width="2.5"/><line x1="407.0" y1="230.0" x2="485.0" y2="449.0" stroke="#0b57a4" stroke-width="3"/><polygon points="485.0,449.0 476.2,439.4 485.8,436.0" fill="#0b57a4"/><line x1="215.0" y1="146.0" x2="557.0" y2="146.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="215.0,146.0 227.0,140.9 227.0,151.1" fill="#1a1a1a"/><polygon points="557.0,146.0 545.0,151.1 545.0,140.9" fill="#1a1a1a"/><text x="386" y="132" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,90 m</text><line x1="185.0" y1="531.0" x2="185.0" y2="170.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="185.0,531.0 179.9,519.0 190.1,519.0" fill="#1a1a1a"/><polygon points="185.0,170.0 190.1,182.0 179.9,182.0" fill="#1a1a1a"/><text x="169" y="359.5" font-size="25" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,95 m</text><text x="579" y="463" font-size="22" font-weight="600" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Até 2% para</text><text x="579" y="493" font-size="22" font-weight="600" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">o ralo</text><text x="215" y="575" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Piso em nível, sem soleira</text><rect x="800" y="40" width="540" height="620" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5"/><rect x="800" y="660" width="540" height="88" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><text x="818" y="78" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Parede do banco</text><rect x="930" y="485.2" width="266" height="24" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><path d="M 956 509.2 v 20 M 1170 509.2 v 20" stroke="#1a1a1a" stroke-width="6"/><line x1="1226.0" y1="660.0" x2="1226.0" y2="485.2" stroke="#1a1a1a" stroke-width="3"/><polygon points="1226.0,660.0 1220.9,648.0 1231.1,648.0" fill="#1a1a1a"/><polygon points="1226.0,485.2 1231.1,497.2 1220.9,497.2" fill="#1a1a1a"/><line x1="1196" y1="485.2" x2="1240" y2="485.2" stroke="#1a1a1a" stroke-width="1.6" /><text x="1238" y="584" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,46 m</text><text x="1063" y="567.2" font-size="20" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Banco articulado ou removível</text><line x1="930.0" y1="465.2" x2="1196.0" y2="465.2" stroke="#1a1a1a" stroke-width="3"/><polygon points="930.0,465.2 942.0,460.1 942.0,470.3" fill="#1a1a1a"/><polygon points="1196.0,465.2 1184.0,470.3 1184.0,460.1" fill="#1a1a1a"/><text x="1063" y="451.2" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Comprimento: mín. 0,70 m</text><line x1="860" y1="445.2" x2="860" y2="90" stroke="#0b57a4" stroke-width="11" stroke-linecap="round"/><text x="880" y="158.39999999999998" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Barra vertical</text><text x="880" y="188.39999999999998" font-size="19" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">na parede do banco</text><text x="1080" y="280" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Profundidade do banco:</text><text x="1080" y="310" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,45 m</text><text x="1080" y="390" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Barras a 90° na parede</text><text x="1080" y="418" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">lateral ao banco</text>
</svg>
