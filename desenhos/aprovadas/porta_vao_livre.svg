06" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Altura livre: mín. 2,10 m</text><line x1="665.7" y1="283.2" x2="296" y2="292" stroke="#1a1a1a" stroke-width="1.8" /><text x="40" y="300" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Folha aberta a 90°</text><text x="985" y="330" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Prática esportiva ou</text><text x="985" y="360" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">equipamentos grandes:</text><text x="985" y="394" font-size="26" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,00 m de largura</text>
