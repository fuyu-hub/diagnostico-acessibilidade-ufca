<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Vão livre da porta</title><desc id="d">Porta aberta a 90 graus. A largura livre, medida da folha aberta até o batente oposto, tem no mínimo 0,80 metro, e a altura livre tem no mínimo 2,10 metros. Em locais de prática esportiva ou com equipamentos grandes, a largura mínima é de 1,00 metro.</desc>
<rect width="1376" height="768" fill="#fff"/>
