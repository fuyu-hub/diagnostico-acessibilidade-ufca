<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Dimensões do degrau</title><desc id="d">Corte de uma escada. O piso do degrau mede entre 0,28 e 0,32 metro e o espelho entre 0,16 e 0,18 metro, e a soma do piso com duas vezes o espelho fica entre 0,63 e 0,65 metro. No detalhe, o bocel avança no máximo 1,5 centímetro sobre o espelho, que é fechado, sem vazados.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="30" y="660" width="796" height="88" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 196 660 V 541 H 406 V 422 H 616 V 302.99999999999994 H 826 V 660 Z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><line x1="406.0" y1="392.0" x2="616.0" y2="392.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="406.0,392.0 418.0,386.9 418.0,397.1" fill="#1a1a1a"/><polygon points="616.0,392.0 604.0,397.1 604.0,386.9" fill="#1a1a1a"/><line x1="406" y1="378" x2="406" y2="422" stroke="#1a1a1a" stroke-width="1.6" /><text x="511" y="346" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Piso (p)</text><text x="511" y="376" font-size="22" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,28 m a 0,32 m</text><line x1="376.0" y1="541.0" x2="376.0" y2="422.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="376.0,541.0 370.9,529.0 381.1,529.0" fill="#1a1a1a"/><polygon points="376.0,422.0 381.1,434.0 370.9,434.0" fill="#1a1a1a"/><line x1="364" y1="422" x2="406" y2="422" stroke="#1a1a1a" stroke-width="1.6" /><text x="360" y="473.5" font-size="26" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Espelho (e)</text><text x="360" y="503.5" font-size="22" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,16 m a 0,18 m</text><rect x="858" y="36" width="490" height="124" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="1103" y="84" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" >Fórmula do degrau</text><text x="1103" y="132" font-size="31" font-weight="700" text-anchor="middle" fill="#1a1a1a" >0,63 m ≤ p + 2e ≤ 0,65 m</text><rect x="858" y="190" width="490" height="356" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="880" y="228" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" >Bocel (ampliado)</text><path d="M 1072 260 H 1346 V 470 H 1138 V 306 H 1072 Z" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><line x1="1072.0" y1="334.0" x2="1138.0" y2="334.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="1072.0,334.0 1081.2,330.1 1081.2,337.9" fill="#1a1a1a"/><polygon points="1138.0,334.0 1128.8,337.9 1128.8,330.1" fill="#1a1a1a"/><line x1="1072" y1="306" x2="1072" y2="346" stroke="#1a1a1a" stroke-width="1.6" /><text x="1058" y="344" font-size="21" font-weight="500" text-anchor="end" fill="#1a1a1a" >Avança no</text><text x="1058" y="372" font-size="21" font-weight="500" text-anchor="end" fill="#1a1a1a" >máximo</text><text x="1058" y="406" font-size="28" font-weight="700" text-anchor="end" fill="#1a1a1a" >1,5 cm</text><text x="880" y="524" font-size="22" font-weight="600" text-anchor="start" fill="#1a1a1a" >Espelho fechado, sem vazados</text><line x1="1188" y1="504" x2="1138" y2="430" stroke="#1a1a1a" stroke-width="1.6" />
</svg>
