dth="2"/><text x="190" y="300" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Acesa e visível</text><text x="860" y="300" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Em bom estado</text><text x="530" y="190" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Apagada ou</text><text x="530" y="222" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >com vidro quebrado</text><text x="530" y="256" font-size="21" font-weight="500" text-anchor="middle" fill="#fff" >Anote como problema</text><line x1="70.0" y1="660.0" x2="1270.0" y2="660.0" stroke="#0b57a4" stroke-width="8"/><polygon points="1270.0,660.0 1247.9,669.3 1247.9,650.7" fill="#0b57a4"/><text x="600" y="636" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Iluminar o caminho até a saída</text><text x="600" y="712" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Confira corredores, escadas e saídas</text>
