<title id="t">Botões do elevador</title><desc id="d">Vista de frente de um elevador. O painel de chamada externo fica entre 0,90 e 1,10 metro do piso. O painel interno da cabina fica entre 0,90 e 1,30 metro. Os botões têm relevo, Braille e contraste com a superfície ao redor.</desc>
