<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Espaços reservados na arquibancada</title><desc id="d">Arquibancada vista de cima, dividida em setores. Cada setor tem um espaço reservado para pessoa em cadeira de rodas, sinalizado com o Símbolo Internacional de Acesso, em 2 por cento do total de assentos ou 1 espaço, o que for maior. Uma rota acessível liga esses espaços aos vestiários e sanitários.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="40" y="56" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" >Vista de cima, sem escala</text><rect x="60" y="110" width="1256" height="230" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="3"/><line x1="60" y1="156" x2="1316" y2="156" stroke="#1a1a1a" stroke-width="2" /><line x1="60" y1="202" x2="1316" y2="202" stroke="#1a1a1a" stroke-width="2" /><line x1="60" y1="248" x2="1316" y2="248" stroke="#1a1a1a" stroke-width="2" /><line x1="60" y1="294" x2="1316" y2="294" stroke="#1a1a1a" stroke-width="2" /><text x="269.33333333333337" y="96" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Setor 1</text><rect x="207.33333333333337" y="294" width="124" height="46" fill="#bcd4ec" stroke="#0b57a4" stroke-width="3"/><g transform="translate(251.33333333333337 299) scale(1)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><circle cx="18" cy="9" r="4" fill="#fff"/><path d="M 18 14 v 9 h 7 l 3 6 M 12 18 a 8 8 0 1 0 9 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><line x1="269.33333333333337" y1="340" x2="269.33333333333337" y2="386" stroke="#0b57a4" stroke-width="7"/><line x1="478.6666666666667" y1="110" x2="478.6666666666667" y2="340" stroke="#1a1a1a" stroke-width="5"/><text x="688" y="96" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Setor 2</text><rect x="626" y="294" width="124" height="46" fill="#bcd4ec" stroke="#0b57a4" stroke-width="3"/><g transform="translate(670 299) scale(1)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><circle cx="18" cy="9" r="4" fill="#fff"/><path d="M 18 14 v 9 h 7 l 3 6 M 12 18 a 8 8 0 1 0 9 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><line x1="688" y1="340" x2="688" y2="386" stroke="#0b57a4" stroke-width="7"/><line x1="897.3333333333334" y1="110" x2="897.3333333333334" y2="340" stroke="#1a1a1a" stroke-width="5"/><text x="1106.6666666666667" y="96" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Setor 3</text><rect x="1044.6666666666667" y="294" width="124" height="46" fill="#bcd4ec" stroke="#0b57a4" stroke-width="3"/><g transform="translate(1088.6666666666667 299) scale(1)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><circle cx="18" cy="9" r="4" fill="#fff"/><path d="M 18 14 v 9 h 7 l 3 6 M 12 18 a 8 8 0 1 0 9 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><line x1="1106.6666666666667" y1="340" x2="1106.6666666666667" y2="386" stroke="#0b57a4" stroke-width="7"/><text x="80" y="190" font-size="22" font-weight="600" text-anchor="start" fill="#1a1a1a" >Assentos</text><line x1="269.33333333333337" y1="386" x2="1136" y2="386" stroke="#0b57a4" stroke-width="7"/><line x1="1136.0" y1="383.0" x2="1136.0" y2="476.0" stroke="#0b57a4" stroke-width="7"/><polygon points="1136.0,476.0 1128.2,457.6 1143.8,457.6" fill="#0b57a4"/><text x="480" y="372" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Rota acessível</text><rect x="960" y="478" width="356" height="180" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><text x="1138" y="562" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Vestiários</text><text x="1138" y="594" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" >e sanitários</text><rect x="60" y="430" width="860" height="290" fill="#e4eee4" stroke="#1a1a1a" stroke-width="2.5"/><text x="490" y="500" font-size="34" font-weight="700" text-anchor="middle" fill="#1a1a1a" >2% do total de assentos</text><text x="490" y="544" font-size="25" font-weight="600" text-anchor="middle" fill="#1a1a1a" >Ou 1 espaço, o que for maior</text><text x="490" y="600" font-size="25" font-weight="600" text-anchor="middle" fill="#1a1a1a" >Em diferentes setores, sinalizados com o SIA</text><text x="490" y="696" font-size="21" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Quadra</text>
</svg>
