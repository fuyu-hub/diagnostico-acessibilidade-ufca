<title id="t">Guarda-corpo e guia de balizamento</title><desc id="d">Dois cortes de rampa. Sem paredes laterais, há guarda-corpo e guia de balizamento com altura mínima de 5 centímetros nos dois lados. Com vedação lateral de pelo menos 1,10 metro, o guarda-corpo e a guia são dispensados.</desc>
