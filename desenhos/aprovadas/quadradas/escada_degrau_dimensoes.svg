<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Dimensões dos degraus</title><desc id="d">Perfil de degraus. O piso (p) mede de 0,28 a 0,32 metro e o espelho (e), de 0,16 a 0,18 metro, com 0,63 metro ≤ p + 2e ≤ 0,65 metro. O espelho é fechado, sem vazados, e o bocel avança no máximo 1,5 centímetro.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="30" y="50" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Piso (p): 0,28 m a 0,32 m</text><text x="30" y="90" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Espelho (e): 0,16 m a 0,18 m</text><polygon points="30,430 30,350 180,350 180,270 330,270 330,190 480,190 480,430" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="20" y="430" width="480" height="30" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><line x1="180.0" y1="244.0" x2="330.0" y2="244.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="180.0,244.0 192.0,238.9 192.0,249.1" fill="#1a1a1a"/><polygon points="330.0,244.0 318.0,249.1 318.0,238.9" fill="#1a1a1a"/><text x="255" y="232" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">p</text><line x1="152.0" y1="350.0" x2="152.0" y2="270.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="152.0,350.0 146.9,338.0 157.1,338.0" fill="#1a1a1a"/><polygon points="152.0,270.0 157.1,282.0 146.9,282.0" fill="#1a1a1a"/><text x="124" y="322" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">e</text><rect x="520" y="200" width="180" height="200" fill="#fff" stroke="#1a1a1a" stroke-width="2" rx="8"/><rect x="536" y="250" width="164" height="26" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><rect x="580" y="276" width="120" height="110" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><line x1="536.0" y1="300.0" x2="580.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="536.0,300.0 545.2,296.1 545.2,303.9" fill="#1a1a1a"/><polygon points="580.0,300.0 570.8,303.9 570.8,296.1" fill="#1a1a1a"/><text x="536" y="236" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bocel</text><text x="610" y="470" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">máx. 1,5 cm</text><rect x="20" y="510" width="680" height="190" fill="#fff" stroke="#1a1a1a" stroke-width="2" rx="8"/><text x="360" y="572" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" >0,63 m ≤ p + 2e ≤ 0,65 m</text><text x="360" y="640" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Espelho fechado,</text><text x="360" y="676" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" >sem vazados</text>
