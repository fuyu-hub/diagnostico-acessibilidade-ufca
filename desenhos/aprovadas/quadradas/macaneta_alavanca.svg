Vista de cima</text><rect x="370" y="380" width="310" height="48" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><text x="525" y="416" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Porta</text><path d="M 650 380 V 262 H 420 q -24 0 -24 28" fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/><line x1="650.0" y1="226.0" x2="396.0" y2="226.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="650.0,226.0 640.8,229.9 640.8,222.1" fill="#1a1a1a"/><polygon points="396.0,226.0 405.2,222.1 405.2,229.9" fill="#1a1a1a"/><text x="525" y="150" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Comprimento:</text><text x="525" y="190" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" >mín. 10 cm</text><line x1="600.0" y1="380.0" x2="600.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="600.0,380.0 596.1,370.8 603.9,370.8" fill="#1a1a1a"/><polygon points="600.0,274.0 603.9,283.2 596.1,283.2" fill="#1a1a1a"/><text x="370" y="474" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >Da porta:</text><text x="370" y="510" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" >mín. 4 cm</text><text x="370" y="590" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" >Tipo alavanca,</text><text x="370" y="626" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >sem arestas e com</text><text x="370" y="662" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >a ponta recurvada</text>
