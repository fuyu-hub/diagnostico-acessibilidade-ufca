<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Maçaneta do tipo alavanca</title><desc id="d">Porta vista de frente, com a maçaneta na faixa de instalação, entre 0,80 metro e 1,10 metro do piso. No detalhe, visto de cima, a maçaneta é do tipo alavanca, sem arestas e com a ponta recurvada, com comprimento mínimo de 10 centímetros e afastada no mínimo 4 centímetros da porta.</desc>
