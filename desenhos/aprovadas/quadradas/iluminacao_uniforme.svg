<title id="t">Iluminação uniforme</title><desc id="d">Duas salas vistas de lado. Incorreto: uma só luminária e a janela sem proteção causam sombra na mesa e ofuscamento. Correto: luminárias bem distribuídas dão luz uniforme, sem sombra na mesa, e a janela tem cortina.</desc>
