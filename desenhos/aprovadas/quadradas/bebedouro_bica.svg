<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Bica do bebedouro</title><desc id="d">Dois bebedouros vistos de lado. Correto: a bica fica no lado frontal e o jato é inclinado, enchendo o copo. Incorreto: a bica fica longe da frente e o jato é vertical, sem encher o copo.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="20" width="680" height="330" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 28 a 8 8 0 0 1 8 -8 h 664 a 8 8 0 0 1 8 8 v 46 h -680 z" fill="#15703a"/><text x="42" y="58" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Correto: jato inclinado, na frente</text><rect x="32" y="314" width="656" height="26" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><rect x="32" y="86" width="44" height="228" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><rect x="76" y="250" width="50" height="64" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 76 190 H 326 V 234 Q 326 250 310 250 H 76 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="296" y="162" width="16" height="28" rx="4" fill="#666" stroke="#1a1a1a" stroke-width="2"/><path d="M 304 160 Q 254 70 208 134" fill="none" stroke="#2f80d0" stroke-width="6" stroke-linecap="round"/><path d="M 184 130 H 230 L 224 190 H 190 Z" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 187 150 H 227 L 224 189 H 190 Z" fill="#9cc6ee"/><text x="380" y="128" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Jato inclinado</text><text x="380" y="164" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">enche o copo</text><text x="380" y="216" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bica na frente</text><line x1="380.0" y1="256.0" x2="480.0" y2="256.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="480.0,256.0 466.2,261.8 466.2,250.2" fill="#1a1a1a"/><text x="492" y="266" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Frente</text><rect x="20" y="370" width="680" height="330" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 378 a 8 8 0 0 1 8 -8 h 664 a 8 8 0 0 1 8 8 v 46 h -680 z" fill="#b91c1c"/><text x="42" y="408" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Incorreto: jato vertical, atrás</text><rect x="32" y="664" width="656" height="26" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><rect x="32" y="436" width="44" height="228" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><rect x="76" y="600" width="50" height="64" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 76 540 H 326 V 584 Q 326 600 310 600 H 76 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="102" y="512" width="16" height="28" rx="4" fill="#666" stroke="#1a1a1a" stroke-width="2"/><path d="M 110 510 V 430" fill="none" stroke="#2f80d0" stroke-width="6" stroke-linecap="round"/><path d="M 170 480 H 216 L 210 540 H 176 Z" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 176 496 l 34 34 m 0 -34 l -34 34" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/><text x="380" y="478" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Jato vertical</text><text x="380" y="514" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">não enche o copo</text><text x="380" y="566" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bica longe da frente</text><line x1="380.0" y1="606.0" x2="480.0" y2="606.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="480.0,606.0 466.2,611.8 466.2,600.2" fill="#1a1a1a"/><text x="492" y="616" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Frente</text>
</svg>
