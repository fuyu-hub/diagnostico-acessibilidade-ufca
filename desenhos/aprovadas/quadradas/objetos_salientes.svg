<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Objetos salientes nas paredes</title><desc id="d">Vista lateral de uma parede. Entre 0,60 metro e 2,10 metros de altura, objetos que avançam até 10 centímetros podem ficar sem sinalização. Os que avançam mais de 10 centímetros precisam de piso tátil de alerta no piso, sob o objeto.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="190" y="157" width="510" height="345" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="11 8"/><rect x="150" y="40" width="40" height="600" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="190" y="200" width="22" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="190" y="330" width="150" height="80" fill="#e04040" stroke="#1a1a1a" stroke-width="2.5" /><text x="240" y="230" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Até 10 cm</text><text x="240" y="266" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem sinalização</text><text x="360" y="360" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Mais de 10 cm</text><text x="360" y="396" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">piso tátil de alerta</text><rect x="0" y="640" width="720" height="80" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="190" y="630" width="150" height="12" fill="#ffdf00" stroke="#1a1a1a" stroke-width="2"/><circle cx="200" cy="628" r="4" fill="#7a6200"/><circle cx="216" cy="628" r="4" fill="#7a6200"/><circle cx="232" cy="628" r="4" fill="#7a6200"/><circle cx="248" cy="628" r="4" fill="#7a6200"/><circle cx="264" cy="628" r="4" fill="#7a6200"/><circle cx="280" cy="628" r="4" fill="#7a6200"/><circle cx="296" cy="628" r="4" fill="#7a6200"/><circle cx="312" cy="628" r="4" fill="#7a6200"/><circle cx="328" cy="628" r="4" fill="#7a6200"/><line x1="265" y1="480" x2="265" y2="622" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="112.0" y1="640.0" x2="112.0" y2="502.0" stroke="#1a1a1a" stroke-width="3"/><polygon points