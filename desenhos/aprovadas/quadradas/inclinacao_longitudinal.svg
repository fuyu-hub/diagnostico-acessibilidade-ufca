<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Inclinação longitudinal do piso</title><desc id="d">Corredor visto de lado, com inclinação ampliada para ficar visível. A inclinação longitudinal deve ser inferior a 5%, menos de 2,9 graus no celular apoiado no piso no sentido da caminhada, medida em 3 pontos do percurso. A partir de 5%, o trecho é tratado como rampa.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="20" width="680" height="220" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="40" y="60" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" >Inclinação longitudinal</text><text x="40" y="104" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" >Inferior a 5%</text><text x="40" y="142" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >menos de 2,9° no celular</text><text x="40" y="178" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >meça em 3 pontos do percurso</text><text x="40" y="216" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" >A partir de 5%: trate como rampa</text><polygon points="20,600 700,520 700,700 20,700" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><line x1="20" y1="600" x2="700" y2="600" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="11 8"/><line x1="670.0" y1="600.0" x2="670.0" y2="523.5" stroke="#1a1a1a" stroke-width="3"/><polygon points="670.0,600.0 665.3,588.9 674.7,588.9" fill="#1a1a1a"/><polygon points="670.0,523.5 674.7,534.6 665.3,534.6" fill="#1a1a1a"/><text x="650" y="572" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Subida</text><circle cx="90" cy="375.7647058823529" r="21" fill="#555"/><rect x="68" y="399.7647058823529" width="44" height="102" rx="15" fill="#555"/><rect x="72" y="497.7647058823529" width="15" height="94" fill="#555"/><rect x="93" y="497.7647058823529" width="15" height="94" fill="#555"/><line x1="140.0" y1="471.8" x2="390.0" y2="436.5" stroke="#0b57a4" stroke-width="5"/><polygon points="390.0,436.5 374.6,445.7 372.6,431.8" fill="#0b57a4"/><text x="140" y="431.7647058823529" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sentido da caminhada</text><g transform="translate(460 548.2352941176471) rotate(-6.71)"><rect x="-80" y="-14" width="160" height="14" rx="5" fill="#222"/></g><text x="360" y="650" font-size="30" font-weight="600" text-anchor="middle" fill="#1a1a1a" >Celular apoiado no piso,</text><text x="360" y="686" font-size="30" font-weight="600" text-anchor="middle" fill="#1a1a1a" >no sentido da caminhada</text>
</svg>
