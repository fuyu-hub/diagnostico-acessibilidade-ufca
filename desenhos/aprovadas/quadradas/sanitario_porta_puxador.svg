<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Porta e puxador do sanitário</title><desc id="d">Em cima, vistas de cima de uma porta que abre para fora e de uma porta de correr, ambas com vão livre mínimo de 0,80 metro. Embaixo, puxador horizontal do lado oposto ao de abertura, com comprimento mínimo de 0,40 metro, diâmetro de 25 a 35 milímetros, entre 0,80 e 1,10 metro do piso.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="170" y="50" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Abre para fora</text><rect x="40" y="190" width="70" height="24" fill="#555"/><rect x="230" y="190" width="70" height="24" fill="#555"/><line x1="230" y1="190" x2="230" y2="70" stroke="#1a1a1a" stroke-width="9" /><path d="M 230 70 A 120 120 0 0 0 110 190" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="110.0" y1="234.0" x2="230.0" y2="234.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="110.0,234.0 120.1,229.7 120.1,238.3" fill="#1a1a1a"/><polygon points="230.0,234.0 219.9,238.3 219.9,229.7" fill="#1a1a1a"/><text x="530" y="50" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Ou de correr</text><rect x="400" y="190" width="70" height="24" fill="#555"/><rect x="590" y="190" width="70" height="24" fill="#555"/><rect x="582" y="172" width="120" height="10" fill="#1a1a1a"/><line x1="590.0" y1="150.0" x2="680.0" y2="150.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="680.0,150.0 668.9,154.7 668.9,145.3" fill="#1a1a1a"/><line x1="470.0" y1="234.0" x2="590.0" y2="234.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="470.0,234.0 480.1,229.7 480.1,238.3" fill="#1a1a1a"/><polygon points="590.0,234.0 579.9,238.3 579.9,229.7" fill="#1a1a1a"/><text x="360" y="278" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vão livre mín. 0,80 m</text><text x="360" y="318" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Embaixo: interior do sanitário</text><rect x="20" y="360" width="380" height="320" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="20" y="680" width="380" height="24" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><rect x="100" y="360" width="160" height="320" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="70" y="460" width="220" height="60" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="11 8"/><line x1="140" y1="490" x2="220" y2="490" stroke="#0b57a4" stroke-width="12" stroke-linecap="round"/><line x1="140.0" y1="510.0" x2="220.0" y2="510.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="140.0,510.0 147.4,506.9 147.4,513.1" fill="#1a1a1a"/><polygon points="220.0,510.0 212.6,513.1 212.6,506.9" fill="#1a1a1a"/><text x="180" y="444" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,40 m</text><text x="298" y="486" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,10 m</text><text x="298" y="522" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,80 m</text><text x="420" y="400" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Puxador</text><text x="420" y="440" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">horizontal</text><text x="420" y="486" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">do lado oposto</text><text x="420" y="522" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">ao de abertura</text><text x="420" y="580" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Diâmetro:</text><text x="420" y="616" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">25 mm a 35 mm</text>
