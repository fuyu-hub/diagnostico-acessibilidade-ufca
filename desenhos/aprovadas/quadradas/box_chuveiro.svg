<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Box de chuveiro</title><desc id="d">Em cima, box visto de cima, com no mínimo 0,90 por 0,95 metro, piso em nível, sem soleira, e inclinação de até 2 por cento para o ralo. Embaixo, banco articulado ou removível a 0,46 metro do piso, com comprimento mínimo de 0,70 metro e profundidade mínima de 0,45 metro, barra vertical na parede do banco e barras a 90 graus na parede lateral.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="100" y="72" width="234" height="247" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5" style="stroke-width:6"/><rect x="100" y="100" width="117" height="182" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><text x="158.5" y="201" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Banco</text><circle cx="294" cy="279" r="15" fill="#888" stroke="#1a1a1a" stroke-width="2.5"/><line x1="254.0" y1="112.0" x2="286.0" y2="262.0" stroke="#0b57a4" stroke-width="3"/><polygon points="286.0,262.0 278.6,251.3 288.5,249.2" fill="#0b57a4"/><line x1="100.0" y1="58.0" x2="334.0" y2="58.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="100.0,58.0 111.1,53.3 111.1,62.7" fill="#1a1a1a"/><polygon points="334.0,58.0 322.9,62.7 322.9,53.3" fill="#1a1a1a"/><text x="217" y="46" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,90 m</text><line x1="80.0" y1="319.0" x2="80.0" y2="72.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="80.0,319.0 75.3,307.9 84.7,307.9" fill="#1a1a1a"/><polygon points="80.0,72.0 84.7,83.1 75.3,83.1" fill="#1a1a1a"/><text x="56" y="195.5" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 56 195.5)">mín. 0,95 m</text><text x="360" y="150" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Até 2%</text><text x="360" y="188" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">de inclinação</text><text x="360" y="224" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">para o ralo</text><text x="360" y="276" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Piso em nível,</text><text x="360" y="312" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem soleira</text><rect x="20" y="340" width="680" height="330" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="20" y="670" width="680" height="30" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><rect x="180" y="532" width="210" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="4"/><path d="M 202 552 v 16 M 368 552 v 16" stroke="#1a1a1a" stroke-width="6"/><line x1="90" y1="502" x2="90" y2="356" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><text x="110" y="392" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Barra vertical</text><text x="110" y="428" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">na parede do banco</text><line x1="180.0" y1="518.0" x2="390.0" y2="518.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="180.0,518.0 191.1,513.3 191.1,522.7" fill="#1a1a1a"/><polygon points="390.0,518.0 378.9,522.7 378.9,513.3" fill="#1a1a1a"/><text x="311" y="506" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Comprimento: mín. 0,70 m</text><line x1="414.0" y1="670.0" x2="414.0" y2="532.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="414.0,670.0 409.3,658.9 418.7,658.9" fill="#1a1a1a"/><polygon points="414.0,532.0 418.7,543.1 409.3,543.1" fill="#1a1a1a"/><line x1="390" y1="532" x2="426" y2="532" stroke="#1a1a1a" stroke-width="1.6" /><text x="428" y="656" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,46 m</text><text x="285" y="606" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Banco articulado</text><text x="285" y="642" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">ou removível</text><text x="690" y="384" font-size="30" font-weight="500" text-anchor="end" fill="#1a1a1a" >Profundidade:</text><text x="690" y="420" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" >mín. 0,45 m</text><text x="516" y="530" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Barras a 90°</text><text x="516" y="566" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">na parede</text><text x="516" y="602" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">lateral</text>
</svg>
