8" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="440" y="140" width="10" height="84" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><text x="338" y="190" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Porta</text><line x1="350" y1="202" x2="488" y2="202" stroke="#0b57a4" stroke-width="7" /><path d="M 483 185 L 517 219 M 517 185 L 483 219" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><text x="338" y="116" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Degrau sem rampa</text><rect x="320" y="370" width="380" height="330" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 320 378 a 8 8 0 0 1 8 -8 h 364 a 8 8 0 0 1 8 8 v 46 h -380 z" fill="#15703a"/><text x="340" y="408" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Correto</text><polygon points="336,574 510,574 620,632 684,632 684,678 336,678" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="440" y="490" width="10" height="84" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><text x="338" y="540" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Porta</text><polyline points="350,552 510,552 620,610 664,610" fill="none" stroke="#0b57a4" stroke-width="7"/><line x1="634.0" y1="610.0" x2="672.0" y2="610.0" stroke="#0b57a4" stroke-width="7"/><polygon points="672.0,610.0 653.6,617.8 653.6,602.2" fill="#0b57a4"/><text x="338" y="466" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Rampa junto ao degrau</text>
