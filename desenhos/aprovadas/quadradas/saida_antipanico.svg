<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Saída de emergência acessível</title><desc id="d">À esquerda, porta de saída de emergência vista de frente, com barra antipânico e vão livre mínimo de 0,80 metro. À direita, dois cortes: um degrau isolado sem rampa bloqueia a saída, o que é incorreto; com rampa junto ao degrau, o percurso fica contínuo, o que é correto.</desc>
