<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Luminárias na rota de fuga</title><desc id="d">Corredor no escuro, visto de lado, até uma porta de saída. As luminárias de emergência estão acesas, visíveis e em bom estado, e iluminam o caminho até a saída. Uma delas está apagada ou com vidro quebrado, o que deve ser anotado como problema. A conferência vale para corredores, escadas e saídas.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="20" width="680" height="540" fill="#3e4552" stroke="#1a1a1a" stroke-width="2.5"/><rect x="20" y="560" width="680" height="140" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><polygon points="111,94 179,94 263,560 27,560" fill="#fff3b0" opacity=".85"/><rect x="99" y="64" width="92" height="30" rx="5" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="123" cy="79" r="10" fill="#ffd84d" stroke="#1a1a1a" stroke-width="2"/><circle cx="167" cy="79" r="10" fill="#ffd84d" stroke="#1a1a1a" stroke-width="2"/><rect x="319" y="64" width="92" height="30" rx="5" fill="#7a7a7a" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="343" cy="79" r="10" fill="#555" stroke="#1a1a1a" stroke-width="2"/><circle cx="387" cy="79" r="10" fill="#555" stroke="#1a1a1a" stroke-width="2"/><path d="M 341 55 L 389 103 M 389 55 L 341 103" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><rect x="495" y="220" width="186" height="340" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5" /><rect x="505" y="232" width="166" height="328" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="517" y="400" width="142" height="15" rx="6" fill="#444"/><rect x="495" y="164" width="186" height="46" rx="4" fill="#15703a" stroke="#1a1a1a" stroke-width="2"/><text x="588" y="198" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >SAÍDA</text><rect x="542" y="64" width="92" height="30" rx="5" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="566" cy="79" r="10" fill="#ffd84d" stroke="#1a1a1a" stroke-width="2"/><circle cx="610" cy="79" r="10" fill="#ffd84d" stroke="#1a1a1a" stroke-width="2"/><text x="145" y="300" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Acesa,</text><text x="145" y="336" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">visível e em</text><text x="145" y="372" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">bom estado</text><text x="365" y="150" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >Apagada ou</text><text x="365" y="186" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >com vidro</text><text x="365" y="222" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >quebrado</text><text x="365" y="270" font-size="30" font-weight="500" text-anchor="middle" fill="#fff" >Anote como</text><text x="365" y="306" font-size="30" font-weight="500" text-anchor="middle" fill="#fff" >problema</text><text x="360" y="602" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Iluminar o caminho até a saída</text><line x1="50.0" y1="632.0" x2="670.0" y2="632.0" stroke="#0b57a4" stroke-width="8"/><polygon points="670.0,632.0 647.9,641.3 647.9,622.7" fill="#0b57a4"/><text x="360" y="682" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Confira corredores, escadas e saídas</text>
