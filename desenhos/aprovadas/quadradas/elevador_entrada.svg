<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Contraste na entrada do elevador</title><desc id="d">Em cima, duas portas de elevador: correta, em cor que contrasta com a parede, e incorreta, da mesma cor da parede. Embaixo, o piso visto de cima: a cabina tem piso duro e antiderrapante, e o pavimento em frente tem cor que contrasta com o da cabina; a soleira não conta.</desc>
