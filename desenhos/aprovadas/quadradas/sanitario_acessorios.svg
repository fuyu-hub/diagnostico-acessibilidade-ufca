<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Alarme, espelho e acessórios</title><desc id="d">Parede de sanitário. O alarme de emergência fica a 40 centímetros do piso, próximo à bacia. O espelho tem borda inferior a no máximo 0,90 metro e superior a pelo menos 1,80 metro, ou cobre a faixa de 0,50 a 1,80 metro. Saboneteira, papeleira, toalheiro e cabide ficam entre 0,80 e 1,20 metro, fora das áreas de transferência e manobra.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="24" y="56" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >Saboneteira, papeleira, toalheiro, cabide</text><rect x="20" y="80" width="680" height="560" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="20" y="640" width="680" height="50" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><rect x="108" y="445" width="38" height="87.5" rx="5" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><path d="M 146 532.5 H 220 Q 222 590 184 597.5 L 180 640 H 146 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="142" y="523.5" width="82" height="9" rx="4" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="60" cy="540" r="15" fill="#dc2626" stroke="#1a1a1a" stroke-width="3"/><line x1="60.0" y1="640.0" x2="60.0" y2="555.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="60.0,640.0 56.1,630.8 63.9,630.8" fill="#1a1a1a"/><polygon points="60.0,555.0 63.9,564.2 56.1,564.2" fill="#1a1a1a"/><text x="30" y="344" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Alarme</text><text x="30" y="380" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">a 40 cm</text><text x="30" y="416" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">do piso</text><rect x="278" y="190" width="150" height="225" fill="#dbe7f3" stroke="#1a1a1a" stroke-width="3"/><path d="M 304 340 L 348 240 M 334 340 L 378 240" stroke="#fff" stroke-width="8"/><text x="353" y="178" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Espelho</text><line x1="260.0" y1="640.0" x2="260.0" y2="415.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="260.0,640.0 255.7,629.9 264.3,629.9" fill="#1a1a1a"/><polygon points="260.0,415.0 264.3,425.1 255.7,425.1" fill="#1a1a1a"/><line x1="250" y1="415" x2="278" y2="415" stroke="#1a1a1a" stroke-width="1.6" /><text x="242" y="527.5" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 242 527.5)">máx. 0,90 m</text><line x1="446.0" y1="640.0" x2="446.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="446.0,640.0 441.7,629.9 450.3,629.9" fill="#1a1a1a"/><polygon points="446.0,190.0 450.3,200.1 441.7,200.1" fill="#1a1a1a"/><line x1="428" y1="190" x2="458" y2="190" stroke="#1a1a1a" stroke-width="1.6" /><text x="466" y="402.5" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 466 402.5)">mín. 1,80 m</text><text x="353" y="470" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Ou cobrindo</text><text x="353" y="506" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >de 0,50 m</text><text x="353" y="542" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >a 1,80 m</text><text x="486" y="196" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Acessórios</text><text x="486" y="232" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,80 m a</text><text x="486" y="268" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,20 m do piso</text><rect x="486" y="340" width="200" height="100" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="11 8"/><rect x="498" y="372" width="36" height="36" rx="5" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="560" cy="390" r="18" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="560" cy="390" r="6" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/><rect x="586" y="384" width="48" height="9" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 658 374 v 18 q 0 11 -12 9" fill="none" stroke="#1a1a1a" stroke-width="4"/><text x="486" y="482" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">fora das áreas</text><text x="486" y="518" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">de transferência</text><text x="486" y="554" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">e manobra</text>
</svg>
