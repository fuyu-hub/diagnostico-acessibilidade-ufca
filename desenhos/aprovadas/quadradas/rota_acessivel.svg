<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Rota acessível até os ambientes</title><desc id="d">Planta simplificada da escola. Uma rota contínua, sem degraus isolados, liga a entrada, na via de menor fluxo de veículos, a salas, biblioteca, auditório, refeitório e sanitário acessível, que fica a até 50 metros de qualquer ponto.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="360" y="54" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Rota contínua, sem degraus</text><text x="360" y="94" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">isolados, até todos os ambientes</text><rect x="20" y="120" width="680" height="470" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="40" y="140" width="200" height="130" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="260" y="140" width="200" height="130" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="480" y="140" width="200" height="130" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><text x="140" y="215" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Salas</text><text x="360" y="215" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Biblioteca</text><text x="580" y="215" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Auditório</text><rect x="40" y="290" width="640" height="70" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5" /><rect x="40" y="380" width="260" height="190" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><text x="170" y="482" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Refeitório</text><rect x="420" y="380" width="260" height="190" fill="rgba(11,87,164,.14)" stroke="#1a1a1a" stroke-width="2.5" style="stroke:#0b57a4"/><text x="550" y="440" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sanitário</text><text x="550" y="482" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">até 50 m de</text><text x="550" y="518" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">qualquer ponto</text><line x1="90" y1="325" x2="630" y2="325" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><line x1="140" y1="325" x2="140" y2="270" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><line x1="360" y1="325" x2="360" y2="270" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><line x1="580" y1="325" x2="580" y2="270" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><line x1="170" y1="325" x2="170" y2="380" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><line x1="550" y1="325" x2="550" y2="380" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><line x1="360" y1="325" x2="360" y2="600" stroke="#0b57a4" stroke-width="10" stroke-linecap="round"/><rect x="0" y="600" width="720" height="120" fill="#8a8a8a"/><rect x="330" y="588" width="60" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" /><text x="360" y="672" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >Entrada na via de menor fluxo</text>
</svg>
