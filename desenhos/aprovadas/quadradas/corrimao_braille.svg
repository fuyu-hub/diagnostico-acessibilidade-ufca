<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Braille no corrimão</title><desc id="d">Corrimão visto de lado, com o número do pavimento em relevo e em Braille. No detalhe ampliado, o número 3 em relevo e a cela Braille correspondente. No corte do tubo, a sinalização fica na geratriz superior, a parte de cima do tubo, onde a mão passa.</desc>
<rect width="720" height="720" fill="#fff"/>
