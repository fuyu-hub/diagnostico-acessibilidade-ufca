t x="470" y="640" width="230" height="60" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="590" cy="420" r="80" fill="#b5bcc4" stroke="#1a1a1a" stroke-width="3"/><path d="M 551.6 349.8 A 80 80 0 0 1 628.4 349.8" fill="none" stroke="#0b57a4" stroke-width="12" stroke-linecap="round"/><line x1="590.0" y1="296.0" x2="590.0" y2="328.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="590.0,328.0 584.9,316.0 595.1,316.0" fill="#1a1a1a"/><text x="480" y="150" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Geratriz</text><text x="480" y="190" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">superior</text><text x="480" y="228" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">onde a mão</text><text x="480" y="262" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">passa</text>
