<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Vão livre da porta</title><desc id="d">Porta em perspectiva, com a folha aberta a 90 graus. A largura livre, da folha aberta até o batente oposto, é de no mínimo 0,80 metro, e a altura livre, de no mínimo 2,10 metros. Em locais de prática esportiva ou com equipamentos grandes, a largura mínima é de 1,00 metro.</desc>
