er="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Folha aberta</text><text x="24" y="206" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">a 90°</text><line x1="326.1" y1="258.4" x2="120" y2="216" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="326.1" cy="258.4" r="6" fill="#1a1a1a"/><text x="24" y="600" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Largura livre</text><text x="24" y="640" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,80 m</text><text x="24" y="680" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">da folha a 90° ao batente</text><line x1="417.9" y1="419.6" x2="230" y2="568" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="417.9" cy="419.6" r="6" fill="#1a1a1a"/><text x="700" y="600" font-size="30" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Esporte ou</text><text x="700" y="636" font-size="30" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">equipamentos:</text><text x="700" y="676" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,00 m</text>
