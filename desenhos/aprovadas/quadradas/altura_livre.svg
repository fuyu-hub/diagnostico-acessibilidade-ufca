<title id="t">Altura livre na circulação</title><desc id="d">Vista lateral de uma calçada. Acima da faixa de circulação há uma altura livre mínima de 2,10 metros. Os galhos da árvore ficam acima desse limite; a placa que invade o espaço livre está incorreta.</desc>
