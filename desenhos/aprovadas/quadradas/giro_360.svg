    <rect x="-46" y="-48" width="92" height="96" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="-40" y="-64" width="66" height="16" rx="7" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-40" y="48" width="66" height="16" rx="7" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-58" y="-36" width="12" height="72" rx="5" fill="#777" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="-4" cy="0" r="24" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="46" y="-30" width="34" height="60" rx="8" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
  </g><path d="M 390 320 A 140 140 0 1 1 250 180" fill="none" stroke="#0b57a4" stroke-width="6"/><line x1="232.0" y1="174.0" x2="250.0" y2="180.0" stroke="#0b57a4" stroke-width="6"/><polygon points="250.0,180.0 228.1,181.7 233.5,165.5" fill="#0b57a4"/><line x1="30.0" y1="590.0" x2="470.0" y2="590.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="30.0,590.0 42.9,584.5 42.9,595.5" fill="#1a1a1a"/><polygon points="470.0,590.0 457.1,595.5 457.1,584.5" fill="#1a1a1a"/><line x1="30" y1="320" x2="30" y2="604" stroke="#1a1a1a" stroke-width="1.6" /><line x1="470" y1="320" x2="470" y2="604" stroke="#1a1a1a" stroke-width="1.6" /><text x="250" y="636" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Diâmetro mínimo: 1,50 m</text><rect x="520" y="250" width="160" height="140" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="600" y="330" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Carteira</text><text x="700" y="60" font-size="38" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Giro de 360°</text><text x="700" y="98" font-size="30" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">junto à carteira,</text><text x="700" y="134" font-size="30" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem obstáculos</text><text x="500" y="444" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Carteira entre</text><text x="500" y="480" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">as demais,</text><text x="500" y="516" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem segregar</text>
