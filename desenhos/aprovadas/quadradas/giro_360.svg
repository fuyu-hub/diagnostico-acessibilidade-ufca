<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Área de giro de 360 graus</title><desc id="d">Vista de cima de uma sala. Junto à carteira, há área livre de obstáculos para giro de 360 graus da cadeira de rodas, com diâmetro mínimo de 1,50 metro. A carteira fica entre as demais, sem segregar quem usa cadeira de rodas.</desc>
<rect width="720" height="720" fill="#fff"/>
