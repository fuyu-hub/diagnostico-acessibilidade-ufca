<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Inclinação transversal do piso</title><desc id="d">Corte do piso com caimento de um lado ao outro, ampliado para ficar visível. Na calçada e na rampa externa, a inclinação transversal é de no máximo 3%. No corredor e na rampa interna, de no máximo 2%.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="360" y="54" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Inclinação transversal</text><rect x="30" y="90" width="40" height="330" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><polygon points="70,250 620,320 620,420 70,420" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="20" y="420" width="680" height="34" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><line x1="70" y1="250" x2="640" y2="250" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="10 8"/><text x="80" y="236" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Linha de nível</text><line x1="600.0" y1="252.0" x2="600.0" y2="316.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="600.0,316.0 594.9,304.0 605.1,304.0" fill="#1a1a1a"/><text x="580" y="300" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Caimento</text><line x1="170.0" y1="340.0" x2="520.0" y2="384.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="170.0,340.0 185.4,335.7 183.8,348.0" fill="#1a1a1a"/><polygon points="520.0,384.0 504.6,388.3 506.2,376.0" fill="#1a1a1a"/><line x1="20" y1="474" x2="700" y2="474" stroke="#cccccc" stroke-width="2" /><text x="30" y="520" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Calçada e rampa externa</text><text x="690" y="520" font-size="38" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">máx. 3%</text><line x1="20" y1="550" x2="700" y2="550" stroke="#cccccc" stroke-width="2" /><text x="30" y="596" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corredor e rampa interna</text><text x="690" y="596" font-size="38" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">máx. 2%</text><text x="30" y="690" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >Inclinação ampliada para ficar visível</text>
</svg>
