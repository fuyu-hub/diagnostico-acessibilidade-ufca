<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Alarme, espelho e acessórios</title><desc id="d">Parede de sanitário. O alarme de emergência fica a 40 centímetros do piso, próximo à bacia. O espelho tem borda inferior a no máximo 0,90 metro e superior a pelo menos 1,80 metro, ou cobre a faixa de 0,50 a 1,80 metro. Saboneteira, papeleira, toalheiro e cabide ficam entre 0,80 e 1,20 metro, fora das áreas de transferência e manobra.</desc>
