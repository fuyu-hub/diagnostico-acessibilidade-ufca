"stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">máx.</text><text x="428" y="565" font-size="24" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,90 m</text><line x1="750.0" y1="690.0" x2="750.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="750.0,690.0 745.7,679.9 754.3,679.9" fill="#1a1a1a"/><polygon points="750.0,78.0 754.3,88.1 745.7,88.1" fill="#1a1a1a"/><line x1="720" y1="78" x2="764" y2="78" stroke="#1a1a1a" stroke-width="1.6" /><text x="764" y="367" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín.</text><text x="764" y="395" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,80 m</text><text x="595" y="503" font-size="20" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Ou cobrindo a faixa</text><text x="595" y="531" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a" >de 0,50 m a 1,80 m</text><rect x="930" y="282" width="390" height="136" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="11 8"/><text x="1125" y="204" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Acessórios</text><text x="1125" y="236" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Entre 0,80 m e 1,20 m do piso</text><text x="1125" y="266" font-size="19" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Fora das áreas de transferência e manobra</text><rect x="958" y="324" width="52" height="52" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="1078" cy="350" r="26" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="1078" cy="350" r="9" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/><rect x="1136" y="342" width="80" height="10" fill="#fff" stroke="#1a1a1a" s