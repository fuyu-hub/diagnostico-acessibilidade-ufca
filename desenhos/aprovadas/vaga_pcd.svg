<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Vaga reservada para pessoa com deficiência</title><desc id="d">Estacionamento visto de cima. Vagas reservadas, em 2 por cento do total ou no mínimo 1 vaga, têm o Símbolo Internacional de Acesso no piso e em placa vertical. Ao lado da vaga há um espaço adicional com no mínimo 1,20 metro de largura, ligado à rota acessível até a entrada.</desc>
