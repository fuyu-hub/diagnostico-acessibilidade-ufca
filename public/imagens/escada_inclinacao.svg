<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Inclinação transversal na escada</title><desc id="d">Escada vista de frente, com o caimento dos degraus ampliado para ficar visível e um celular apoiado de um lado ao outro. O limite é de 2 por cento, ou 1,1 grau no celular, na escada externa, e de 1 por cento, ou 0,6 grau, na escada interna.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="110" y="60" font-size="26" font-weight="700" text-anchor="start" fill="#1a1a1a" >Escada vista de frente</text><polygon points="110,240 780,300 780,470 110,410" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><polygon points="110,410 780,470 780,640 110,580" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="3"/><polygon points="110,580 780,640 780,680 110,680" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><text x="445" y="532" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Confira degraus e patamares</text><line x1="110" y1="240" x2="820" y2="240" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="11 8"/><text x="110" y="224" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Linha de nível</text><line x1="806.0" y1="240.0" x2="806.0" y2="300.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="806.0,240.0 809.9,249.2 802.1,249.2" fill="#1a1a1a"/><polygon points="806.0,300.0 802.1,290.8 809.9,290.8" fill="#1a1a1a"/><text x="820" y="279" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Caimento</text><g transform="translate(445 270) rotate(5.117314849972638)"><rect x="-90" y="-16" width="180" height="16" rx="5" fill="#222"/></g><text x="445" y="332" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Celular apoiado no degrau</text><line x1="255.0" y1="343.0" x2="635.0" y2="377.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="255.0,343.0 269.3,338.4 268.2,350.0" fill="#1a1a1a"/><polygon points="635.0,377.0 620.7,381.6 621.8,370.0" fill="#1a1a1a"/><text x="445" y="404" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Atravessado, de um lado ao outro</text><rect x="950" y="110" width="380" height="340" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="972" y="152" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" >Inclinação transversal</text><text x="972" y="198" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >Escada externa</text><text x="972" y="232" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a" >máx. 2%</text><text x="972" y="262" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" >1,1° no celular</text><text x="972" y="314" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >Escada interna</text><text x="972" y="348" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a" >máx. 1%</text><text x="972" y="378" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" >0,6° no celular</text><text x="972" y="424" font-size="20" font-weight="600" text-anchor="start" fill="#1a1a1a" >Meça em pelo menos 3 pontos</text><text x="1330" y="722" font-size="19" text-anchor="end" fill="#555555">Inclinação ampliada para ficar visível.</text>
</svg>
