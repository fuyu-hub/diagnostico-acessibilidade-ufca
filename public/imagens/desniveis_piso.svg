<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Tratamento de desníveis no piso</title><desc id="d">Três casos de desnível. Até 5 milímetros, pode ficar sem tratamento. De 5 a 20 milímetros, precisa de chanfro com inclinação máxima de 1 para 2, ou 50 por cento. Acima de 20 milímetros, é tratado como degrau, com rampa associada.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="40" y="60" width="412" height="500" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="40" y="60" width="412" height="64" rx="10" fill="#15703a"/><text x="246" y="104" font-size="28" font-weight="700" text-anchor="middle" fill="#fff" >Até 5 mm</text><text x="246" y="470" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Pode ficar</text><text x="246" y="504" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >sem tratamento</text><rect x="482" y="60" width="412" height="500" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="482" y="60" width="412" height="64" rx="10" fill="#d97706"/><text x="688" y="104" font-size="28" font-weight="700" text-anchor="middle" fill="#fff" >De 5 mm a 20 mm</text><text x="688" y="470" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Chanfro com inclinação</text><text x="688" y="504" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >máxima de 1:2 (50%)</text><rect x="924" y="60" width="412" height="500" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="924" y="60" width="412" height="64" rx="10" fill="#b91c1c"/><text x="1130" y="104" font-size="28" font-weight="700" text-anchor="middle" fill="#fff" >Acima de 20 mm</text><text x="1130" y="470" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Tratar como degrau,</text><text x="1130" y="504" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >com rampa associada</text><path d="M 62 380 V 340 H 240 V 324 H 430 V 380 Z" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><line x1="210.0" y1="324.0" x2="210.0" y2="340.0" stroke="#1a1a1a" stroke-width="2"/><polygon points="210.0,324.0 212.3,329.5 207.7,329.5" fill="#1a1a1a"/><polygon points="210.0,340.0 207.7,334.5 212.3,334.5" fill="#1a1a1a"/><path d="M 504 380 V 340 H 632 L 752 280 H 872 V 380 Z" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><line x1="632" y1="340" x2="782" y2="340" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 6"/><line x1="752" y1="340" x2="752" y2="280" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 6"/><text x="697" y="368" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a" >2</text><text x="770" y="318" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1</text><path d="M 946 380 V 340 H 1124 V 240 H 1314 V 380 Z" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/><polygon points="946,340 1124,340 1124,240" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="10 7"/><text x="1020" y="274" font-size="24" font-weight="700" text-anchor="middle" fill="#0b57a4" >Rampa</text><text x="688" y="610" font-size="20" text-anchor="middle" fill="#555555">Desenhos ampliados, sem escala. O ideal é não haver desnível.</text>
</svg>
