<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Porta e puxador do sanitário</title><desc id="d">À esquerda, vistas de cima de uma porta que abre para fora e de uma porta de correr, ambas com vão livre mínimo de 0,80 metro. À direita, puxador horizontal do lado oposto ao de abertura, com comprimento mínimo de 0,40 metro, diâmetro de 25 a 35 milímetros, entre 0,80 e 1,10 metro do piso.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="40" y="62" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Vistas de cima</text><text x="190" y="130" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Abre para fora</text><rect x="40" y="340" width="70" height="26" fill="#555"/><rect x="270" y="340" width="70" height="26" fill="#555"/><line x1="270" y1="340" x2="270" y2="180" stroke="#1a1a1a" stroke-width="9"/><path d="M 270 180 A 160 160 0 0 0 110 340" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="110.0" y1="388.0" x2="270.0" y2="388.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="110.0,388.0 122.0,382.9 122.0,393.1" fill="#1a1a1a"/><polygon points="270.0,388.0 258.0,393.1 258.0,382.9" fill="#1a1a1a"/><text x="190" y="422" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vão livre: mín. 0,80 m</text><text x="190" y="468" font-size="20" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Interior do sanitário</text><text x="550" y="130" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Ou de correr</text><rect x="400" y="340" width="70" height="26" fill="#555"/><rect x="630" y="340" width="70" height="26" fill="#555"/><rect x="622" y="322" width="160" height="10" fill="#1a1a1a"/><line x1="630.0" y1="300.0" x2="750.0" y2="300.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="750.0,300.0 738.9,304.7 738.9,295.3" fill="#1a1a1a"/><line x1="470.0" y1="388.0" x2="630.0" y2="388.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="470.0,388.0 482.0,382.9 482.0,393.1" fill="#1a1a1a"/><polygon points="630.0,388.0 618.0,393.1 618.0,382.9" fill="#1a1a1a"/><text x="550" y="422" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vão livre: mín. 0,80 m</text><text x="550" y="468" font-size="20" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Interior do sanitário</text><rect x="820" y="165" width="526" height="525" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5"/><rect x="820" y="690" width="526" height="58" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="900" y="165" width="240" height="525" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="860" y="360" width="320" height="90" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="2.5" stroke-dasharray="11 8"/><line x1="960" y1="405" x2="1080" y2="405" stroke="#0b57a4" stroke-width="12" stroke-linecap="round"/><line x1="960.0" y1="429.0" x2="1080.0" y2="429.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="960.0,429.0 968.3,425.5 968.3,432.5" fill="#1a1a1a"/><polygon points="1080.0,429.0 1071.7,432.5 1071.7,425.5" fill="#1a1a1a"/><text x="1020" y="387" font-size="21" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,40 m</text><text x="1192" y="386" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,10 m</text><text x="1192" y="442" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,80 m</text><text x="1083" y="56" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Puxador horizontal</text><text x="1083" y="88" font-size="21" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Do lado oposto ao de abertura</text><text x="1083" y="120" font-size="22" font-weight="600" text-anchor="middle" fill="#1a1a1a" >Diâmetro: 25 mm a 35 mm</text>
</svg>
