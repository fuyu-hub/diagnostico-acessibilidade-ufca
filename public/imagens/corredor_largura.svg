<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Largura livre do corredor</title><desc id="d">Corredor em perspectiva com um extintor saliente na parede. A trena mede a distância entre a face do extintor e a parede oposta, que é o ponto mais estreito, e essa largura livre deve ter no mínimo 1,50 metro. Uma linha tracejada em um trecho sem obstáculo mostra que aquela medida não define a largura do corredor.</desc>
<rect width="1376" height="768" fill="#fff"/>
<polygon points="420.0,170.0 1056.5,537.5 1056.5,401.0 420.0,33.5" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="420.0,170.0 247.2,269.8 247.2,133.3 420.0,33.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="420.0,170.0 1056.5,537.5 883.8,637.3 247.2,269.8" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><line x1="392.7" y1="353.8" x2="565.5" y2="254.0" stroke="#6b6b6b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="11 9"/><ellipse cx="791.0" cy="396.8" rx="64.3" ry="37.1" fill="rgba(217,119,6,.18)" stroke="#d97706" stroke-width="3" stroke-dasharray="10 7"/><polygon points="820.1,390.5 798.3,403.1 798.3,303.4 820.1,290.8" fill="#b91c1c" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><polygon points="761.9,382.1 798.3,403.1 798.3,303.4 761.9,282.3" fill="#dc2626" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><polygon points="783.7,269.8 820.1,290.8 798.3,303.4 761.9,282.3" fill="#fca5a5" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><line x1="629.1" y1="490.2" x2="780.1" y2="403.1" stroke="#d97706" stroke-width="6"/><polygon points="629.1,490.2 640.0,475.9 647.0,488.0" fill="#d97706"/><polygon points="780.1,403.1 769.2,417.5 762.2,405.3" fill="#d97706"/><polygon points="247.2,269.8 883.8,637.3 883.8,628.9 247.2,261.4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="1056.5,537.5 883.8,637.3 883.8,628.9 1056.5,529.1" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><g transform="translate(629.1 490.2)"><rect x="-27" y="-24" width="54" height="42" rx="8" fill="#d97706" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="0" cy="-3" r="11" fill="#fff" stroke="#1a1a1a" stroke-width="2"/></g><line x1="704.6" y1="446.7" x2="500" y2="612" stroke="#1a1a1a" stroke-width="1.8"/><text x="150" y="640" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Largura livre: mín. 1,50 m</text><text x="150" y="670" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Meça no ponto mais estreito</text><line x1="479.1" y1="303.9" x2="250" y2="442" stroke="#1a1a1a" stroke-width="1.8"/><text x="36" y="470" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Trecho sem obstáculo</text><text x="36" y="500" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Não define a largura do corredor</text><line x1="798.3" y1="329.6" x2="1040" y2="142" stroke="#1a1a1a" stroke-width="1.8"/><text x="925" y="120" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Obstáculo reduz a largura</text><text x="925" y="150" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Extintor, mural, prateleira ou móvel</text>
</svg>
