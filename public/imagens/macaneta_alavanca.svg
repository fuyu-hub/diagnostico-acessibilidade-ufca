<title id="t">Maçaneta do tipo alavanca</title><desc id="d">Porta com maçaneta do tipo alavanca instalada entre 0,80 e 1,10 metro do piso. No detalhe, a maçaneta tem no mínimo 10 centímetros de comprimento, fica a no mínimo 4 centímetros da porta, não tem arestas e tem a extremidade recurvada.</desc>
