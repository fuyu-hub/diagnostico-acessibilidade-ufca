="424" x2="835" y2="464" stroke="#1a1a1a" stroke-width="1.5"/><line x1="910" y1="424" x2="910" y2="464" stroke="#1a1a1a" stroke-width="1.5"/><line x1="835.0" y1="436.0" x2="910.0" y2="436.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="835.0,436.0 844.2,432.1 844.2,439.9" fill="#1a1a1a"/><polygon points="910.0,436.0 900.8,439.9 900.8,432.1" fill="#1a1a1a"/><text x="928" y="410" font-size="21" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Prolonga pelo menos 0,30 m</text><text x="928" y="436" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">além do início e do término</text><text x="964" y="580" font-size="21" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Extremidade recurvada</text><line x1="958.0" y1="572.0" x2="938.0" y2="486.0" stroke="#1a1a1a" stroke-width="2"/><polygon points="938.0,486.0 944.5,494.9 936.1,496.8" fill="#1a1a1a"/><text x="520" y="728" font-size="21" font-weight="600" text-anchor="middle" fill="#1a1a1a" >Alturas medidas da face superior do corrimão até o piso</text><rect x="836" y="24" width="514" height="262" fill="#fff" stroke="#1a1a1a" stroke-width="2" rx="6"/><text x="856" y="58" font-size="21" font-weight="700" text-anchor="start" fill="#1a1a1a" >Seção do corrimão (ampliada)</text><defs><pattern id="hachura" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1a1a1a" stroke-width="1.5"/></pattern></defs><rect x="878" y="76" width="44" height="190" fill="url(#hachura)" stroke="#1a1a1a" stroke-width="2"/><rect x="922" y="154" width="62" height="12" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="1028" cy="160" r="44" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="4"/><line x1="922.0" y1="23