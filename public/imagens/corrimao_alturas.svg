<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Alturas e prolongamento do corrimão duplo</title><desc id="d">Vista lateral de rampa com corrimão duplo. O corrimão superior fica a 0,92 metro e o inferior a 0,70 metro, medidos da face superior até o piso. Os corrimãos se prolongam pelo menos 0,30 metro além do início e do término, com extremidades recurvadas. No detalhe, a seção circular tem diâmetro entre 3 e 4,5 centímetros e fica afastada no mínimo 4 centímetros da parede.</desc>
<rect width="1376" height="768" fill="#fff"/>
