<title id="t">Espaço ao lado da maçaneta</title><desc id="d">Porta vista de cima. Ao lado da maçaneta, no lado para onde a folha abre, há um espaço livre de 0,60 metro onde a pessoa em cadeira de rodas se aproxima, sem móveis, lixeiras ou carrinhos.</desc>
