<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Iluminação uniforme</title><desc id="d">Dois cortes de um ambiente com uma pessoa sentada à mesa. No incorreto, há uma só luminária, sombra sobre a mesa e ofuscamento por uma janela sem proteção. No correto, as luminárias são bem distribuídas, não há sombra sobre mesas, lousa e bancadas, e a janela tem cortina ou persiana.</desc>
