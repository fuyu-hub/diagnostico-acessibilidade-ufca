y="30" width="640" height="690" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="706" y="30" width="640" height="54" rx="10" fill="#15703a"/><text x="1026" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Correto: luz uniforme</text><clipPath id="sala-correta"><rect x="722" y="96" width="608" height="534"/></clipPath><rect x="722" y="96" width="608" height="534" fill="#fff6cf"/><polygon points="810,108 862,108 986,630 686,630" fill="rgba(255,214,84,.28)" clip-path="url(#sala-correta)"/><polygon points="1000,108 1052,108 1176,630 876,630" fill="rgba(255,214,84,.28)" clip-path="url(#sala-correta)"/><polygon points="1190,108 1242,108 1366,630 1066,630" fill="rgba(255,214,84,.28)" clip-path="url(#sala-correta)"/><rect x="802" y="96" width="68" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><rect x="992" y="96" width="68" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><rect x="1182" y="96" width="68" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><rect x="1308" y="210" width="22" height="200" fill="#dbe7f3" stroke="#1a1a1a" stroke-width="2.5"/><rect x="1272" y="192" width="36" height="236" fill="#b9c8d8" stroke="#1a1a1a" stroke-width="2.5"/><line x1="1282" y1="192" x2="1282" y2="428" stroke="#1a1a1a" stroke-width="1.6" /><line x1="1294" y1="192" x2="1294" y2="428" stroke="#1a1a1a" stroke-width="1.6" /><line x1="1306" y1="192" x2="1306" y2="428" stroke="#1a1a1a" stroke-width="1.6" /><rect x="722" y="630" width="608" height="74" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><circle cx="836" cy="436" r="24" fill="#555" stroke="none" stroke-width="2"/><rect x="814" y="462" width="44" height="92" rx="14" fill="#555" stroke="none" stroke-width="2"/><rect x="802" y="554" width="64" height="12" fill="#777"/><rect x="828" y="566" width="12" height="64" fill="#777"/><rect x="876" y="516" width="270" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="892" y="530" width="12" height="100" fill="#777"/><rect x="1118" y="530" width="12" height="100" fill="#777"/><text x="1006" y="190" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Luminárias bem distribuídas</text><text x="1006" y="300" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sem sombra sobre</text><text x="1006" y="330" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mesas, lousa e bancadas</text><text x="1262" y="470" font-size="22" font-weight="600" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Cortina ou persiana</text>
