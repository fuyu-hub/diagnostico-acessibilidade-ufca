<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Corrimão intermediário</title><desc id="d">Vista de cima de rampa ou escada com 2,40 metros ou mais de largura. Um corrimão intermediário divide a largura em faixas de no mínimo 1,20 metro. No patamar com mais de 1,40 metro, ele é interrompido, deixando passagem de no mínimo 0,80 metro. O corrimão intermediário é duplo, nas alturas de 0,92 metro e 0,70 metro; a alternativa é ter corrimãos dos dois lados.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="24" y="56" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vista de cima: 2,40 m ou mais de largura</text><rect x="90" y="100" width="230" height="288" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><rect x="320" y="100" width="150" height="288" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5" /><rect x="470" y="100" width="230" height="288" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><line x1="90" y1="107" x2="700" y2="107" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="90" y1="381" x2="700" y2="381" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="90" y1="244" x2="347" y2="244" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="443" y1="244" x2="700" y2="244" stroke="#0b57a4" stroke-width="9" stroke-linecap="round"/><line x1="50.0" y1="388.0" x2="50.0" y2="100.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="50.0,388.0 44.9,376.0 55.1,376.0" fill="#1a1a1a"/><polygon points="50.0,100.0 55.1,112.0 44.9,112.0" fill="#1a1a1a"/><text x="30" y="244" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 30 244)">2,40 m</text><line x1="112.0" y1="236.0" x2="112.0" y2="114.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="112.0,236.0 107.7,225.9 116.3,225.9" fill="#1a1a1a"/><polygon points="112.0,114.0 116.3,124.1 107.7,124.1" fill="#1a1a1a"/><line x1="112.0" y1="374.0" x2="112.0" y2="252.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="112.0,374.0 107.7,363.9 116.3,363.9" fill="#1a1a1a"/><polygon points="112.0,252.0 116.3,262.1 107.7,262.1" fill="#1a1a1a"/><text x="126" y="190" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,20 m</text><text x="126" y="364" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,20 m</text><line x1="347.0" y1="274.0" x2="443.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="347.0,274.0 356.2,270.1 356.2,277.9" fill="#1a1a1a"/><polygon points="443.0,274.0 433.8,277.9 433.8,270.1" fill="#1a1a1a"/><text x="395" y="314" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,80 m</text><line x1="320.0" y1="414.0" x2="470.0" y2="414.0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="320.0,414.0 329.2,410.1 329.2,417.9" fill="#1a1a1a"/><polygon points="470.0,414.0 460.8,417.9 460.8,410.1" fill="#1a1a1a"/><text x="395" y="454" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Patamar acima de 1,40 m</text><text x="395" y="490" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corrimão intermediário interrompido</text><rect x="20" y="540" width="680" height="160" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="360" y="584" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Corrimão intermediário duplo,</text><text x="360" y="622" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >nas alturas de 0,92 m e 0,70 m</text><text x="360" y="674" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Ou corrimãos dos dois lados</text>
</svg>
