<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Altura da bacia e assento</title><desc id="d">Em cima, bacia sanitária vista de lado, com altura entre 0,43 e 0,46 metro com assento, e entre 0,43 e 0,45 metro sem assento. Embaixo, dois assentos vistos de cima: o correto não tem abertura frontal, e o incorreto tem.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="24" width="680" height="346" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="20" y="370" width="680" height="26" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><path d="M 20 62 H 100 V 172 H 274 Q 280 172 280 178 V 236 Q 244 326 216 370 H 20 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="100" y="158" width="188" height="14" rx="6" fill="#777" stroke="#1a1a1a" stroke-width="2.5"/><line x1="336.0" y1="370.0" x2="336.0" y2="158.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="336.0,370.0 330.9,358.0 341.1,358.0" fill="#1a1a1a"/><polygon points="336.0,158.0 341.1,170.0 330.9,170.0" fill="#1a1a1a"/><line x1="292" y1="158" x2="348" y2="158" stroke="#1a1a1a" stroke-width="1.6" /><text x="354" y="200" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Com assento</text><text x="354" y="236" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,43 m a 0,46 m</text><text x="354" y="286" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sem assento</text><text x="354" y="322" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,43 m a 0,45 m</text><text x="120" y="66" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >Altura da bacia</text><ellipse cx="170" cy="515" rx="78" ry="100" fill="#777" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="170" cy="515" rx="48" ry="68" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><ellipse cx="550" cy="515" rx="78" ry="100" fill="#777" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="550" cy="515" rx="48" ry="68" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><rect x="528" y="573" width="44" height="50" fill="#fff"/><path d="M 528 575 V 611 M 572 575 V 611" stroke="#1a1a1a" stroke-width="3"/><text x="360" y="500" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Assento</text><text x="360" y="536" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">visto de cima</text><text x="170" y="660" font-size="30" font-weight="700" text-anchor="middle" fill="#15703a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Correto</text><text x="170" y="696" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem abertura</text><text x="550" y="660" font-size="30" font-weight="700" text-anchor="middle" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Incorreto</text><text x="550" y="696" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">com abertura</text>
