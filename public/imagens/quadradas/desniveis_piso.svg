<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Desníveis no piso</title><desc id="d">Três cortes de piso, ampliados. Desnível de até 5 milímetros pode ficar sem tratamento. Entre 5 e 20 milímetros, o desnível tem chanfro com inclinação de no máximo 1 para 2, ou 50%. Acima de 20 milímetros, é tratado como degrau, com rampa associada. O ideal é não haver desnível.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="20" width="680" height="212" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 28 a 8 8 0 0 1 8 -8 h 664 a 8 8 0 0 1 8 8 v 50 h -680 z" fill="#1e7a3d"/><text x="40" y="60" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Até 5 mm: sem tratamento</text><polygon points="60,200 60,150 340,150 340,144 660,144 660,200 " fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><text x="380" y="120" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Ideal: sem desnível</text><rect x="20" y="252" width="680" height="212" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 260 a 8 8 0 0 1 8 -8 h 664 a 8 8 0 0 1 8 8 v 50 h -680 z" fill="#b45309"/><text x="40" y="292" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >5 mm a 20 mm: chanfro 1:2 (50%)</text><polygon points="60,432 60,392 300,392 380,352 660,352 660,432" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><line x1="300" y1="392" x2="380" y2="392" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5"/><line x1="380" y1="392" x2="380" y2="352" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5"/><text x="340" y="424" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">2</text><text x="404" y="382" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1</text><rect x="20" y="484" width="680" height="212" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 492 a 8 8 0 0 1 8 -8 h 664 a 8 8 0 0 1 8 8 v 50 h -680 z" fill="#b42020"/><text x="40" y="524" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Acima de 20 mm: degrau</text><polygon points="60,664 60,634 440,634 440,564 660,564 660,664" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="260,634 440,564 440,634" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="9 7"/><text x="80" y="598" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Com rampa</text>
</svg>
