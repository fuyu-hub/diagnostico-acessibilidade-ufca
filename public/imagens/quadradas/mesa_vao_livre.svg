<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Vão livre sob mesas e bancadas</title><desc id="d">Mesa vista de frente e de lado. O espaço livre sob o tampo, sem contar pés, travessas e gavetas, tem altura mínima de 0,73 metro, largura mínima de 0,80 metro e profundidade mínima de 0,50 metro.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="560" width="680" height="40" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><text x="360" y="56" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Espaço livre sob o tampo</text><text x="360" y="96" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem contar pés, travessas e gavetas</text><text x="252" y="269.1" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vista de frente</text><rect x="120" y="319.1" width="264" height="240.9" fill="rgba(11,87,164,.14)"/><rect x="80" y="293.1" width="344" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="94" y="319.1" width="26" height="240.9" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="384" y="319.1" width="26" height="240.9" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><line x1="70.0" y1="560.0" x2="70.0" y2="319.1" stroke="#1a1a1a" stroke-width="3"/><polygon points="70.0,560.0 65.3,548.9 74.7,548.9" fill="#1a1a1a"/><polygon points="70.0,319.1 74.7,330.2 65.3,330.2" fill="#1a1a1a"/><text x="48" y="439.55" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 48 439.55)">mín. 0,73 m</text><text x="18" y="439.55" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 18 439.55)">altura livre</text><line x1="120.0" y1="520.0" x2="384.0" y2="520.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="120.0,520.0 131.1,515.3 131.1,524.7" fill="#1a1a1a"/><polygon points="384.0,520.0 372.9,524.7 372.9,515.3" fill="#1a1a1a"/><text x="590" y="269.1" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vista de lado</text><rect x="490" y="319.1" width="165" height="240.9" fill="rgba(11,87,164,.14)"/><rect x="464" y="293.1" width="235" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="464" y="319.1" width="26" height="240.9" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><line x1="490.0" y1="520.0" x2="655.0" y2="520.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="490.0,520.0 501.1,515.3 501.1,524.7" fill="#1a1a1a"/><polygon points="655.0,520.0 643.9,524.7 643.9,515.3" fill="#1a1a1a"/><text x="30" y="644" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Largura livre</text><text x="30" y="680" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,80 m</text><text x="700" y="644" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Profundidade livre</text><text x="700" y="680" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,50 m</text>
