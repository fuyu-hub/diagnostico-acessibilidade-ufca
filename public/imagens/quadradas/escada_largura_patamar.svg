<title id="t">Largura da escada e patamares</title><desc id="d">Vistas de cima de escadas. A largura mínima é de 1,20 metro. Entre lances em linha, o patamar tem comprimento mínimo de 1,20 metro. Na mudança de direção, o patamar tem dimensões iguais à largura da escada.</desc>
