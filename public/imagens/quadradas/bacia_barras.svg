<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Barras de apoio da bacia sanitária</title><desc id="d">Duas vistas da bacia sanitária. Na parede lateral, barra horizontal de no mínimo 0,80 metro a 0,75 metro do piso, avançando 0,50 metro além da borda frontal, e barra vertical de no mínimo 0,70 metro, começando 0,10 metro acima da horizontal, a 0,30 metro da borda frontal. Na parede do fundo, barra de no mínimo 0,80 metro a 0,75 metro do piso, estendendo-se 0,30 metro além do eixo da bacia, que fica a 0,40 metro da parede lateral. A válvula de descarga fica a no máximo 1,00 metro. As barras têm diâmetro de 30 a 45 milímetros e afastamento mínimo de 40 milímetros.</desc>
