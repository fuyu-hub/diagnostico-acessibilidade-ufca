<title id="t">Sinalização luminosa no piso</title><desc id="d">Auditório com luz reduzida, visto de cima, com pontos de luz ao longo do corredor até a saída. No detalhe, as duas formas de sinalizar: próxima ao piso, na lateral do assento, ou no próprio piso.</desc>
