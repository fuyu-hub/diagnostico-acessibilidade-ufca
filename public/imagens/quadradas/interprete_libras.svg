<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Local do intérprete de Libras</title><desc id="d">Duas cenas com um intérprete de Libras. Na correta, o local é identificado com o símbolo de pessoas com deficiência auditiva, a iluminação é direcional e a pessoa fica visível da cabeça aos joelhos, sem sombra no fundo. Na incorreta, não há identificação, a luz lateral projeta sombra no fundo e um móvel encobre as pernas.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="20" width="330" height="680" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 28 a 8 8 0 0 1 8 -8 h 314 a 8 8 0 0 1 8 8 v 46 h -330 z" fill="#15703a"/><text x="40" y="58" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Correto</text><clipPath id="palco-correto"><rect x="30" y="76" width="310" height="544"/></clipPath><rect x="30" y="76" width="310" height="544" fill="#f2f2f2"/><rect x="30" y="620" width="310" height="70" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><polygon points="142,86 178,86 278,620 42,620" fill="#ffe680" opacity=".75" clip-path="url(#palco-correto)"/><rect x="132" y="76" width="56" height="12" fill="#333"/><g transform="translate(160 620) scale(.72) translate(-160 -620)"><circle cx="160" cy="290" r="34" fill="#444"/><rect x="118" y="330" width="84" height="150" rx="22" fill="#444"/><rect x="124" y="472" width="30" height="148" fill="#444"/><rect x="166" y="472" width="30" height="148" fill="#444"/><path d="M 122 352 L 68 400 L 114 330 M 198 352 L 252 400 L 206 330" fill="none" stroke="#444" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="316.0" y1="357.9" x2="316.0" y2="562.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="316.0,357.9 320.7,369.0 311.3,369.0" fill="#1a1a1a"/><polygon points="316.0,562.0 311.3,550.9 320.7,550.9" fill="#1a1a1a"/><line x1="190" y1="357.91999999999996" x2="328" y2="357.91999999999996" stroke="#1a1a1a" stroke-width="1.6" /><line x1="190" y1="562" x2="328" y2="562" stroke="#1a1a1a" stroke-width="1.6" /><text x="294" y="459.96" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 294 459.96)">Da cabeça</text><text x="334" y="459.96" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 334 459.96)">aos joelhos</text><g transform="translate(38 90) scale(1.5555555555555556)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><path d="M 13 21 C 8 9 27 5 27 16 C 27 22 20 21 20 27 a 4 4 0 0 1 -7 2" fill="none" stroke="#fff" stroke-width="2.6"/><line x1="8" y1="30" x2="29" y2="7" stroke="#fff" stroke-width="2.6"/></g><text x="104" y="116" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Local</text><text x="104" y="148" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">identificado</text><text x="38" y="196" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Iluminação</text><text x="38" y="232" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">direcional</text><rect x="370" y="20" width="330" height="680" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 370 28 a 8 8 0 0 1 8 -8 h 314 a 8 8 0 0 1 8 8 v 46 h -330 z" fill="#b91c1c"/><text x="390" y="58" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Incorreto</text><clipPath id="palco-incorreto"><rect x="380" y="76" width="310" height="544"/></clipPath><rect x="380" y="76" width="310" height="544" fill="#f2f2f2"/><rect x="380" y="620" width="310" height="70" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><polygon points="396,300 396,326 510,470 510,290" fill="#ffe680" opacity=".75"/><rect x="380" y="294" width="16" height="36" fill="#333"/><g transform="translate(100 -4) skewX(-4)" opacity=".9"><g transform="translate(510 620) scale(.72) translate(-510 -620)"><circle cx="510" cy="290" r="34" fill="#8d8d94"/><rect x="468" y="330" width="84" height="150" rx="22" fill="#8d8d94"/><rect x="474" y="472" width="30" height="148" fill="#8d8d94"/><rect x="516" y="472" width="30" height="148" fill="#8d8d94"/><path d="M 472 352 L 418 400 L 464 330 M 548 352 L 602 400 L 556 330" fill="none" stroke="#8d8d94" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(510 620) scale(.72) translate(-510 -620)"><circle cx="510" cy="290" r="34" fill="#444"/><rect x="468" y="330" width="84" height="150" rx="22" fill="#444"/><rect x="474" y="472" width="30" height="148" fill="#444"/><rect x="516" y="472" width="30" height="148" fill="#444"/><path d="M 472 352 L 418 400 L 464 330 M 548 352 L 602 400 L 556 330" fill="none" stroke="#444" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="412" y="490" width="196" height="130" fill="#b08a5a" stroke="#1a1a1a" stroke-width="2.5" rx="4"/><text x="386" y="118" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sem identificação</text><text x="386" y="158" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sombra no fundo</text><text x="510" y="546" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >Pernas</text><text x="510" y="582" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >encobertas</text>
</svg>
