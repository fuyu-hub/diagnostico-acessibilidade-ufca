<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Espaços reservados na arquibancada</title><desc id="d">Arquibancada vista de cima, dividida em setores. Cada setor tem um espaço reservado para pessoa em cadeira de rodas, sinalizado com o Símbolo Internacional de Acesso, em 2 por cento do total de assentos ou 1 espaço, o que for maior. Uma rota acessível liga esses espaços aos vestiários e sanitários.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="76" width="680" height="200" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5" /><line x1="20" y1="116" x2="700" y2="116" stroke="#1a1a1a" stroke-width="2" /><line x1="20" y1="156" x2="700" y2="156" stroke="#1a1a1a" stroke-width="2" /><line x1="20" y1="196" x2="700" y2="196" stroke="#1a1a1a" stroke-width="2" /><line x1="20" y1="236" x2="700" y2="236" stroke="#1a1a1a" stroke-width="2" /><text x="133.33333333333331" y="60" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Setor 1</text><rect x="87.33333333333331" y="236" width="92" height="40" fill="#bcd4ec" stroke="#0b57a4" stroke-width="3"/><g transform="translate(116.33333333333331 239) scale(0.9444444444444444)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><circle cx="18" cy="9" r="4" fill="#fff"/><path d="M 18 14 v 9 h 7 l 3 6 M 12 18 a 8 8 0 1 0 9 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><line x1="133.33333333333331" y1="276" x2="133.33333333333331" y2="306" stroke="#0b57a4" stroke-width="7" /><line x1="246.66666666666666" y1="76" x2="246.66666666666666" y2="276" stroke="#1a1a1a" stroke-width="5" /><text x="360" y="60" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Setor 2</text><rect x="314" y="236" width="92" height="40" fill="#bcd4ec" stroke="#0b57a4" stroke-width="3"/><g transform="translate(343 239) scale(0.9444444444444444)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><circle cx="18" cy="9" r="4" fill="#fff"/><path d="M 18 14 v 9 h 7 l 3 6 M 12 18 a 8 8 0 1 0 9 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><line x1="360" y1="276" x2="360" y2="306" stroke="#0b57a4" stroke-width="7" /><line x1="473.3333333333333" y1="76" x2="473.3333333333333" y2="276" stroke="#1a1a1a" stroke-width="5" /><text x="586.6666666666666" y="60" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Setor 3</text><rect x="540.6666666666666" y="236" width="92" height="40" fill="#bcd4ec" stroke="#0b57a4" stroke-width="3"/><g transform="translate(569.6666666666666 239) scale(0.9444444444444444)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><circle cx="18" cy="9" r="4" fill="#fff"/><path d="M 18 14 v 9 h 7 l 3 6 M 12 18 a 8 8 0 1 0 9 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><line x1="586.6666666666666" y1="276" x2="586.6666666666666" y2="306" stroke="#0b57a4" stroke-width="7" /><text x="34" y="148" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >Assentos</text><line x1="133.33333333333331" y1="306" x2="590" y2="306" stroke="#0b57a4" stroke-width="7" /><line x1="590.0" y1="303.0" x2="590.0" y2="392.0" stroke="#0b57a4" stroke-width="7"/><polygon points="590.0,392.0 582.2,373.6 597.8,373.6" fill="#0b57a4"/><text x="150" y="346" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Rota acessível</text><rect x="470" y="394" width="230" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><text x="585" y="462" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Vestiários</text><text x="585" y="498" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >e sanitários</text><rect x="20" y="362" width="430" height="338" fill="#e4eee4" stroke="#1a1a1a" stroke-width="2.5" /><text x="44" y="418" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" >2% do total</text><text x="44" y="460" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" >de assentos</text><text x="44" y="510" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" >ou 1 espaço, o que</text><text x="44" y="546" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" >for maior</text><text x="44" y="596" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >em diferentes setores,</text><text x="44" y="632" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >sinalizados com o SIA</text><text x="44" y="684" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >Quadra</text><text x="470" y="600" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >Vista de cima,</text><text x="470" y="636" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >sem escala</text>
</svg>
