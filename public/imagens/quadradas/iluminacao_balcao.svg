<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Iluminação no balcão de atendimento</title><desc id="d">Duas cenas com um atendente de frente, atrás do balcão. Na correta, o rosto recebe luz uniforme, a boca fica visível e a leitura labial é possível. Na incorreta, uma janela atrás do atendente deixa o rosto na sombra, e a leitura labial fica difícil.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="20" width="330" height="680" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 20 28 a 8 8 0 0 1 8 -8 h 314 a 8 8 0 0 1 8 8 v 46 h -330 z" fill="#15703a"/><text x="40" y="58" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Correto</text><rect x="30" y="76" width="310" height="444" fill="#fbf3d4"/><polygon points="141,88 229,88 335,520 35,520" fill="#ffe680" opacity=".7"/><rect x="131" y="76" width="108" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><path d="M 40 520 Q 40 406 185 406 Q 330 406 330 520 Z" fill="#7b8794" stroke="#1a1a1a" stroke-width="3"/><clipPath id="rosto-correto"><circle cx="185" cy="300" r="92"/></clipPath><circle cx="185" cy="300" r="92" fill="#d5d9df" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="151" cy="280" rx="10" ry="12" fill="#222"/><ellipse cx="219" cy="280" rx="10" ry="12" fill="#222"/><path d="M 171 302 q 14 16 22 5" fill="none" stroke="#555" stroke-width="3"/><ellipse cx="185" cy="344" rx="32" ry="15" fill="#555" stroke="#222" stroke-width="2.5"/><rect x="30" y="520" width="310" height="28" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="50" y="548" width="270" height="142" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><line x1="185.0" y1="446.0" x2="185.0" y2="362.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="185.0,362.0 190.5,374.9 179.5,374.9" fill="#1a1a1a"/><text x="185" y="482" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Boca visível</text><text x="185" y="598" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Leitura labial</text><text x="185" y="640" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" >possível</text><text x="185" y="128" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Luz sobre a face</text><rect x="370" y="20" width="330" height="680" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><path d="M 370 28 a 8 8 0 0 1 8 -8 h 314 a 8 8 0 0 1 8 8 v 46 h -330 z" fill="#b91c1c"/><text x="390" y="58" font-size="30" font-weight="700" text-anchor="start" fill="#fff" >Incorreto</text><rect x="380" y="76" width="310" height="444" fill="#5a616e"/><rect x="405" y="162" width="260" height="230" fill="#fffbe0" stroke="#1a1a1a" stroke-width="3"/><line x1="535" y1="162" x2="535" y2="392" stroke="#1a1a1a" stroke-width="3" /><path d="M 390 520 Q 390 406 535 406 Q 680 406 680 520 Z" fill="#7b8794" stroke="#1a1a1a" stroke-width="3"/><clipPath id="rosto-incorreto"><circle cx="535" cy="300" r="92"/></clipPath><circle cx="535" cy="300" r="92" fill="#d5d9df" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="501" cy="280" rx="10" ry="12" fill="#222"/><ellipse cx="569" cy="280" rx="10" ry="12" fill="#222"/><path d="M 521 302 q 14 16 22 5" fill="none" stroke="#555" stroke-width="3"/><ellipse cx="535" cy="344" rx="32" ry="15" fill="#555" stroke="#222" stroke-width="2.5"/><rect x="443" y="208" width="184" height="184" fill="#20242c" opacity=".78" clip-path="url(#rosto-incorreto)"/><rect x="380" y="520" width="310" height="28" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="400" y="548" width="270" height="142" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><line x1="535.0" y1="446.0" x2="535.0" y2="362.0" stroke="#fff" stroke-width="3"/><polygon points="535.0,362.0 540.5,374.9 529.5,374.9" fill="#fff"/><text x="535" y="482" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Boca no escuro</text><text x="535" y="598" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Leitura labial</text><text x="535" y="640" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" >difícil</text><text x="535" y="124" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >Janela atrás</text><text x="535" y="154" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >do atendente</text>
