<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Alturas, prolongamento e seção do corrimão</title><desc id="d">Vista lateral de rampa com corrimão duplo. O corrimão superior fica a 0,92 metro e o inferior a 0,70 metro, medidos do topo do corrimão até o piso. Os corrimãos se prolongam pelo menos 0,30 metro além do início e do término, com ponta recurvada. No detalhe, a seção circular tem diâmetro entre 3 e 4,5 centímetros e fica afastada no mínimo 4 centímetros da parede.</desc>
<rect width="720" height="720" fill="#fff"/>
<polygon points="30,330 110,330 500,380 700,380 700,410 30,410" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><line x1="110" y1="330" x2="110" y2="192" stroke="#1a1a1a" stroke-width="4"/><line x1="300" y1="354.35897435897436" x2="300" y2="216.35897435897436" stroke="#1a1a1a" stroke-width="4"/><line x1="500" y1="380" x2="500" y2="242" stroke="#1a1a1a" stroke-width="4"/><line x1="545" y1="380" x2="545" y2="242" stroke="#1a1a1a" stroke-width="4"/><path d="M 65 220 Q 65 192 87 192 L 110 192 L 500 242 L 545 242 Q 567 242 567 270" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><path d="M 65 253 Q 65 225 87 225 L 110 225 L 500 275 L 545 275 Q 567 275 567 303" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><line x1="230.0" y1="345.4" x2="230.0" y2="207.4" stroke="#1a1a1a" stroke-width="3"/><polygon points="230.0,345.4 224.5,332.5 235.5,332.5" fill="#1a1a1a"/><polygon points="230.0,207.4 235.5,220.3 224.5,220.3" fill="#1a1a1a"/><text x="216" y="296" font-size="38" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,92 m</text><line x1="470.0" y1="376.2" x2="470.0" y2="271.2" stroke="#1a1a1a" stroke-width="3"/><polygon points="470.0,376.2 464.5,363.3 475.5,363.3" fill="#1a1a1a"/><polygon points="470.0,271.2 475.5,284.0 464.5,284.0" fill="#1a1a1a"/><text x="456" y="336" font-size="38" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,70 m</text><text x="30" y="56" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Alturas: do topo</text><text x="30" y="92" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">do corrimão ao piso</text><line x1="500.0" y1="214.0" x2="545.0" y2="214.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="500.0,214.0 509.2,210.1 509.2,217.9" fill="#1a1a1a"/><polygon points="545.0,214.0 535.8,217.9 535.8,210.1" fill="#1a1a1a"/><line x1="522" y1="214" x2="560" y2="168" stroke="#1a1a1a" stroke-width="2.5"/><text x="430" y="56" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Prolonga</text><text x="430" y="100" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,30 m</text><text x="430" y="138" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">ponta recurvada</text><rect x="20" y="430" width="680" height="270" fill="#fff" stroke="#1a1a1a" stroke-width="2" rx="8"/><defs><pattern id="hachura" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1a1a1a" stroke-width="1.5"/></pattern></defs><rect x="50" y="460" width="44" height="220" fill="url(#hachura)" stroke="#1a1a1a" stroke-width="2"/><rect x="94" y="583" width="60" height="14" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="218" cy="590" r="64" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="5"/><line x1="154.0" y1="508.0" x2="282.0" y2="508.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="154.0,508.0 165.1,503.3 165.1,512.7" fill="#1a1a1a"/><polygon points="282.0,508.0 270.9,512.7 270.9,503.3" fill="#1a1a1a"/><line x1="94.0" y1="676.0" x2="154.0" y2="676.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="94.0,676.0 103.2,672.1 103.2,679.9" fill="#1a1a1a"/><polygon points="154.0,676.0 144.8,679.9 144.8,672.1" fill="#1a1a1a"/><text x="330" y="476" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >Seção (ampliada)</text><text x="330" y="522" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >Diâmetro:</text><text x="330" y="564" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" >3 cm a 4,5 cm</text><text x="330" y="624" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" >Afastamento:</text><text x="330" y="666" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" >mín. 4 cm</text>
</svg>
