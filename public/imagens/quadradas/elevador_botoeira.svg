<title id="t">Botões do elevador</title><desc id="d">Parede com os painéis do elevador. O painel externo de chamada fica entre 0,90 e 1,10 metro do piso; o painel interno da cabina, entre 0,90 e 1,30 metro. No detalhe, o botão do número 2 em relevo e em Braille, com contraste.</desc>
