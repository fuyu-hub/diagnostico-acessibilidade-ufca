<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Largura livre do corredor</title><desc id="d">Corredor em perspectiva com um obstáculo junto à parede, como extintor, mural ou móvel, que reduz a largura. A largura livre mínima de 1,50 metro é medida no ponto mais estreito; o trecho sem obstáculo não define a largura.</desc>
<rect width="720" height="720" fill="#fff"/>
<polygon points="226.0,196.0 656.2,444.4 656.2,304.0 226.0,55.6" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="226.0,196.0 48.3,298.6 48.3,158.2 226.0,55.6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="226.0,196.0 656.2,444.4 478.5,547.0 48.3,298.6" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><line x1="141.8" y1="352.6" x2="319.5" y2="250.0" stroke="#6b6b6b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="11 9"/><ellipse cx="495.4" cy="364.5" rx="66.1" ry="38.2" fill="rgba(217,119,6,.18)" stroke="#d97706" stroke-width="3" stroke-dasharray="10 7"/><polygon points="525.3,358.0 502.9,371.0 502.9,268.4 525.3,255.4" fill="#b91c1c" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><polygon points="465.4,349.4 502.9,371.0 502.9,268.4 465.4,246.8" fill="#dc2626" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><polygon points="487.9,233.8 525.3,255.4 502.9,268.4 465.4,246.8" fill="#fca5a5" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><line x1="328.9" y1="460.6" x2="484.1" y2="371.0" stroke="#d97706" stroke-width="6"/><polygon points="328.9,460.6 339.7,446.2 346.7,458.4" fill="#d97706"/><polygon points="484.1,371.0 473.3,385.3 466.3,373.2" fill="#d97706"/><polygon points="48.3,298.6 478.5,547.0 478.5,538.4 48.3,290.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="656.2,444.4 478.5,547.0 478.5,538.4 656.2,435.8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><g transform="translate(328.9 460.6)"><rect x="-27" y="-24" width="54" height="42" rx="8" fill="#d97706" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="0" cy="-3" r="11" fill="#fff" stroke="#1a1a1a" stroke-width="2"/></g><text x="24" y="600" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Largura livre</text><text x="24" y="640" font-size="38" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 1,50 m</text><text x="24" y="680" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">no ponto mais estreito</text><line x1="406.5" y1="415.8" x2="220" y2="568" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="406.5" cy="415.8" r="6" fill="#1a1a1a"/><text x="24" y="380" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sem obstáculo:</text><text x="24" y="416" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">não define</text><text x="24" y="452" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">a largura</text><line x1="186.2" y1="326.9" x2="120" y2="350" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="186.2" cy="326.9" r="6" fill="#1a1a1a"/><text x="700" y="56" font-size="38" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Obstáculo</text><text x="700" y="94" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">reduz a largura</text><text x="700" y="130" font-size="30" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">extintor, mural, móvel</text><line x1="502.9" y1="295.4" x2="600" y2="142" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="502.9" cy="295.4" r="6" fill="#1a1a1a"/>
</svg>
