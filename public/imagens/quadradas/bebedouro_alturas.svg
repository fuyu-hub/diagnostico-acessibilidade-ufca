<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Alturas do bebedouro</title><desc id="d">Parede com bebedouros. A bica a 0,90 metro, para cadeira de rodas e crianças, tem altura livre mínima de 0,73 metro embaixo. A bica para adultos em pé fica entre 1,00 e 1,10 metro. O acionamento fica entre 0,80 e 1,20 metro, com área de aproximação frontal de 0,80 por 1,20 metro.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="215" width="680" height="435" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="20" y="650" width="680" height="50" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><text x="30" y="52" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bica a 0,90 m</text><text x="30" y="88" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">cadeira de rodas e crianças</text><text x="30" y="136" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Aproximação frontal:</text><text x="30" y="172" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,80 m × 1,20 m</text><rect x="90" y="438.3" width="190" height="211.7" fill="rgba(11,87,164,.14)"/><rect x="90" y="373" width="190" height="65.30000000000001" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="10"/><path d="M 173 373 v -24 h 30" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/><line x1="52.0" y1="650.0" x2="52.0" y2="389.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="52.0,650.0 47.3,638.9 56.7,638.9" fill="#1a1a1a"/><polygon points="52.0,389.0 56.7,400.1 47.3,400.1" fill="#1a1a1a"/><text x="34" y="519.5" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 34 519.5)">0,90 m</text><line x1="126.0" y1="650.0" x2="126.0" y2="438.3" stroke="#1a1a1a" stroke-width="3"/><polygon points="126.0,650.0 121.3,638.9 130.7,638.9" fill="#1a1a1a"/><polygon points="126.0,438.3 130.7,449.4 121.3,449.4" fill="#1a1a1a"/><text x="160" y="544.15" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 160 544.15)">mín. 0,73 m</text><text x="194" y="544.15" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round" transform="rotate(-90 194 544.15)">altura livre</text><rect x="320" y="329.5" width="160" height="320.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="10"/><path d="M 388 329.5 v -24 h 30" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/><text x="400" y="458.6" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bica:</text><text x="400" y="494.6" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,00 m a</text><text x="400" y="530.6" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,10 m</text><text x="400" y="566.6" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">em pé</text><rect x="494" y="302" width="200" height="116" fill="rgba(217,119,6,.20)" stroke="#d97706" stroke-width="3" stroke-dasharray="11 8"/><text x="594" y="370" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Acionamento</text><text x="694" y="292" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">1,20 m</text><text x="694" y="452" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,80 m</text>
</svg>
