<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Mapa tátil da rota de fuga</title><desc id="d">À esquerda, parede de uma sala com um mapa ao lado da porta. À direita, o mapa ampliado mostra a rota de fuga até a saída, em formato visual, com cores e textos, e tátil, com paredes e rota em relevo e Braille. O mapa deve existir em salas de aula, laboratórios e auditório.</desc>
<rect width="720" height="720" fill="#fff"/>
<rect x="20" y="30" width="200" height="370" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5" /><rect x="20" y="400" width="200" height="22" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5" /><rect x="36" y="150" width="100" height="250" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="122" cy="290" r="7" fill="#444"/><rect x="150" y="230" width="62" height="46" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><path d="M 162 264 H 186 V 242 H 202" fill="none" stroke="#0b57a4" stroke-width="3"/><text x="120" y="72" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Parede</text><text x="120" y="108" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >da sala</text><line x1="212" y1="230" x2="244" y2="70" stroke="#1a1a1a" stroke-width="1.8" /><line x1="212" y1="276" x2="244" y2="360" stroke="#1a1a1a" stroke-width="1.8" /><rect x="244" y="30" width="456" height="370" fill="#eef1f4" stroke="#1a1a1a" stroke-width="7"/><path d="M 244 168 H 418.8 M 501.6 168 H 700" fill="none" stroke="#1a1a1a" stroke-width="7"/><path d="M 244 269.20000000000005 H 547.6 M 630.4000000000001 269.20000000000005 H 700" fill="none" stroke="#1a1a1a" stroke-width="7"/><path d="M 400.4 30 V 168 M 556.8 30 V 168" fill="none" stroke="#1a1a1a" stroke-width="7"/><path d="M 474 269.20000000000005 V 400" fill="none" stroke="#1a1a1a" stroke-width="7"/><polyline points="322.2,103.60000000000001 460.20000000000005,103.60000000000001 460.20000000000005,218.6 589,218.6 589,333.6 676.4000000000001,333.6" fill="none" stroke="#0b57a4" stroke-width="8" stroke-dasharray="2 16" stroke-linecap="round"/><line x1="648.8" y1="333.6" x2="696.0" y2="333.6" stroke="#0b57a4" stroke-width="6"/><polygon points="696.0,333.6 677.6,341.4 677.6,325.8" fill="#0b57a4"/><circle cx="322.2" cy="103.60000000000001" r="17" fill="#b91c1c" stroke="#1a1a1a" stroke-width="2.5"/><rect x="596" y="350" width="96" height="42" rx="4" fill="#15703a"/><text x="644" y="382" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" >Saída</text><circle cx="42" cy="454" r="15" fill="#b91c1c" stroke="#1a1a1a" stroke-width="2.5"/><text x="70" y="465" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Você está aqui</text><text x="24" y="516" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Visual:</text><text x="140" y="516" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">cores e textos de leitura fácil</text><text x="24" y="562" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Tátil:</text><text x="140" y="562" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">paredes e rota em relevo</text><text x="24" y="612" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Braille:</text><circle cx="150" cy="599" r="5.5" fill="#1a1a1a"/><circle cx="150" cy="614" r="5.5" fill="#1a1a1a"/><circle cx="165" cy="584" r="5.5" fill="#1a1a1a"/><circle cx="190" cy="584" r="5.5" fill="#1a1a1a"/><circle cx="230" cy="614" r="5.5" fill="#1a1a1a"/><circle cx="245" cy="584" r="5.5" fill="#1a1a1a"/><circle cx="270" cy="584" r="5.5" fill="#1a1a1a"/><circle cx="285" cy="584" r="5.5" fill="#1a1a1a"/><circle cx="285" cy="599" r="5.5" fill="#1a1a1a"/><circle cx="310" cy="584" r="5.5" fill="#1a1a1a"/><text x="370" y="612" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">"saída"</text><text x="24" y="664" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Em salas, laboratórios e auditório</text><text x="24" y="702" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >Planta ilustrativa</text>
