<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Corrimão no corredor da plateia</title><desc id="d">Dois cortes de corredores de plateia, um com rampa e outro com degraus. Em ambos há pelo menos um corrimão a 0,70 metro de altura, e o corredor fica livre de obstáculos.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="360" y="56" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corredor da plateia</text><text x="182.5" y="118" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Com rampa</text><polygon points="20,530 56,530 309,400 345,400 345,590 20,590" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><polyline points="32,362 56,362 309,232 333,232" fill="none" stroke="#0b57a4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><line x1="96" y1="345.44664031620556" x2="96" y2="509.44664031620556" stroke="#777" stroke-width="6" /><line x1="269" y1="256.5533596837945" x2="269" y2="420.5533596837945" stroke="#777" stroke-width="6" /><line x1="132.5" y1="490.7" x2="132.5" y2="328.7" stroke="#1a1a1a" stroke-width="3"/><polygon points="132.5,490.7 127.8,479.6 137.2,479.6" fill="#1a1a1a"/><polygon points="132.5,328.7 137.2,339.7 127.8,339.7" fill="#1a1a1a"/><text x="144.5" y="416.69169960474306" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,70 m</text><text x="345" y="210" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corrimão</text><text x="537.5" y="118" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Com degraus</text><polygon points="375,530 411,530 411,497.5 474.25,497.5 474.25,465 537.5,465 537.5,432.5 600.75,432.5 600.75,400 664,400 700,400 700,590 375,590" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><polyline points="387,329.5 411,329.5 600.75,232 624.75,232" fill="none" stroke="#0b57a4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><line x1="411" y1="333.5" x2="411" y2="497.5" stroke="#777" stroke-width="6" /><line x1="600.75" y1="236" x2="600.75" y2="400" stroke="#777" stroke-width="6" /><line x1="474.3" y1="465.0" x2="474.3" y2="303.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="474.3,465.0 469.6,453.9 478.9,453.9" fill="#1a1a1a"/><polygon points="474.3,303.0 478.9,314.1 469.6,314.1" fill="#1a1a1a"/><text x="486.25" y="391" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,70 m</text><text x="700" y="210" font-size="30" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corrimão</text><text x="360" y="646" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Ao menos um corrimão,</text><text x="360" y="684" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">com o corredor livre de obstáculos</text>
