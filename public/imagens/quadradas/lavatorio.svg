r="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sem coluna, com</text><text x="150" y="546" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">coluna suspensa</text><text x="150" y="582" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">ou sobre tampo</text><text x="556" y="44" font-size="30" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Vista de cima</text><rect x="466" y="66" width="180" height="84" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="556" cy="108" rx="56" ry="26" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="556" cy="290" r="140" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3.5" stroke-dasharray="12 8"/><g transform="translate(556 290) rotate(270) scale(0.8)" opacity="1">
