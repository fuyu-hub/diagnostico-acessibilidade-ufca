<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Espaço ao lado da maçaneta</title><desc id="d">Vista de cima de uma porta. Ao lado da maçaneta, no sentido de abertura da porta, há espaço livre de no mínimo 0,60 metro, sem móveis, lixeiras ou carrinhos.</desc>
<rect width="720" height="720" fill="#fff"/>
<text x="20" y="50" font-size="30" font-weight="500" text-anchor="start" fill="#555555" >Vista de cima</text><rect x="20" y="200" width="40" height="30" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5" /><rect x="260" y="200" width="440" height="30" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5" /><rect x="260" y="230" width="120" height="240" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="3" stroke-dasharray="11 8"/><g transform="translate(320 380) rotate(-90) scale(0.7)" opacity="1">
    <rect x="-46" y="-48" width="92" height="96" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="-40" y="-64" width="66" height="16" rx="7" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-40" y="48" width="66" height="16" rx="7" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-58" y="-36" width="12" height="72" rx="5" fill="#777" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="-4" cy="0" r="24" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="46" y="-30" width="34" height="60" rx="8" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
  </g><rect x="60" y="210" width="200" height="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 60 430 A 200 200 0 0 0 260 220" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="8 7"/><line x1="60" y1="220" x2="60" y2="430" stroke="#555555" stroke-width="5" stroke-dasharray="12 8"/><rect x="236" y="222" width="16" height="16" rx="4" fill="#444"/><text x="244" y="120" font-size="30" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Maçaneta</text><line x1="244" y1="130" x2="244" y2="206" stroke="#1a1a1a" stroke-width="2.5" /><text x="20" y="520" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">A folha abre</text><text x="20" y="556" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">para este lado</text><line x1="260.0" y1="504.0" x2="380.0" y2="504.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="260.0,504.0 271.1,499.3 271.1,508.7" fill="#1a1a1a"/><polygon points="380.0,504.0 368.9,508.7 368.9,499.3" fill="#1a1a1a"/><line x1="260" y1="470" x2="260" y2="516" stroke="#1a1a1a" stroke-width="1.6" /><line x1="380" y1="470" x2="380" y2="516" stroke="#1a1a1a" stroke-width="1.6" /><text x="320" y="554" font-size="38" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,60 m</text><text x="410" y="280" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Espaço livre ao</text><text x="410" y="316" font-size="30" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">lado da maçaneta</text><text x="410" y="364" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">no sentido de</text><text x="410" y="400" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">abertura da porta</text><text x="410" y="448" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem móveis nem</text><text x="410" y="484" font-size="30" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">lixeiras</text>
