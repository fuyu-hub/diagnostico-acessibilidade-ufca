<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Corrimão no corredor da plateia</title><desc id="d">Dois cortes de corredores de plateia, um com rampa e outro com degraus. Em ambos há pelo menos um corrimão a 0,70 metro de altura, e o corredor fica livre de obstáculos.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="350" y="150" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Corredor com rampa</text><polygon points="40,630 120,630 580,470 660,470 660,690 40,690" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><polyline points="90,420 120,420 580,260 610,260" fill="none" stroke="#0b57a4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><line x1="180" y1="403.13043478260875" x2="180" y2="609.1304347826087" stroke="#777" stroke-width="7"/><line x1="520" y1="284.8695652173913" x2="520" y2="490.8695652173913" stroke="#777" stroke-width="7"/><line x1="350.0" y1="550.0" x2="350.0" y2="346.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="350.0,550.0 344.9,538.0 355.1,538.0" fill="#1a1a1a"/><polygon points="350.0,346.0 355.1,358.0 344.9,358.0" fill="#1a1a1a"/><text x="364" y="454" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,70 m</text><text x="580" y="234" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corrimão</text><text x="1026" y="150" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Corredor com degraus</text><polygon points="716,630 796,630 796,590 911,590 911,550 1026,550 1026,510 1141,510 1141,470 1256,470 1336,470 1336,690 716,690" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><polyline points="766,380 796,380 1141,260 1171,260" fill="none" stroke="#0b57a4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><line x1="796" y1="384" x2="796" y2="590" stroke="#777" stroke-width="7"/><line x1="1141" y1="264" x2="1141" y2="470" stroke="#777" stroke-width="7"/><line x1="911.0" y1="550.0" x2="911.0" y2="346.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="911.0,550.0 905.9,538.0 916.1,538.0" fill="#1a1a1a"/><polygon points="911.0,346.0 916.1,358.0 905.9,358.0" fill="#1a1a1a"/><text x="925" y="454" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,70 m</text><text x="1141" y="234" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Corrimão</text><text x="688" y="736" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Ao menos um corrimão, com o corredor livre de obstáculos</text>
