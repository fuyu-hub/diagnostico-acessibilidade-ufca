<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Sanitário acessível: giro e transferência</title><desc id="d">Sanitário acessível em perspectiva. Um círculo de 1,50 metro de diâmetro, livre de peças, permite o giro de 360 graus. Ao lado da bacia, uma área de transferência lateral de 0,80 por 1,20 metro. A bacia com assento tem altura entre 0,43 e 0,46 metro. A porta abre para fora e tem vão livre mínimo de 0,80 metro.</desc>
