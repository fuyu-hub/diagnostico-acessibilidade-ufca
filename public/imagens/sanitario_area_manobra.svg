-width="2" stroke-linejoin="round"/><ellipse cx="557.4" cy="190.1" rx="36.3" ry="20.9" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><ellipse cx="557.4" cy="190.1" rx="21.8" ry="12.6" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/><polygon points="831.7,249.3 775.3,281.8 775.3,267.0 831.7,234.5" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><polygon points="711.2,244.8 775.3,281.8 775.3,267.0 711.2,230.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><polygon points="767.6,197.5 831.7,234.5 775.3,267.0 711.2,230.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><ellipse cx="771.5" cy="232.3" rx="23.6" ry="13.6" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/><polygon points="290.8,351.4 383.1,404.7 383.1,389.9 290.8,336.6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="485.7,463.9 572.8,514.2 572.8,499.4 485.7,449.1" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polygon points="842.0,358.8 572.8,514.2 572.8,499.4 842.0,344.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" /><polyline points="383.1,404.7 373.0,411.2 364.0,418.3 356.5,425.9 350.3,433.9 345.6,442.2 342.4,450.8 340.8,459.5 340.8,468.3 342.4,477.0 345.6,485.5 350.3,493.9 356.5,501.9 364.0,509.5 373.0,516.6 383.1,523.1" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 6"/><line x1="485.7" y1="463.9" x2="383.1" y2="523.1" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" /><line x1="588.2" y1="444.6" x2="1002" y2="394" stroke="#1a1a1a" stroke-width="1.8"/><text x="1010" y="402" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Giro de 360° livre</text><text x="1010" y="429" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Diâmetro mínimo: 1,50 m</text><line x1="611.3" y1="299.6" x2="952" y2="114" stroke="#1a1a1a" stroke-width="1.8"/><text x="960" y="122" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Transferência lateral</text><text x="960" y="149" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,80 m × 1,20 m</text><line x1="557.4" y1="190.1" x2="345" y2="132" stroke="#1a1a1a" stroke-width="1.8"/><text x="36" y="110" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bacia com assento</text><text x="36" y="137" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Altura entre 0,43 m e 0,46 m</text><line x1="428.0" y1="438.0" x2="250" y2="572" stroke="#1a1a1a" stroke-width="1.8"/><text x="60" y="600" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Porta abre para fora</text><text x="60" y="627" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vão livre: mín. 0,80 m</text><text x="1352" y="752" font-size="16" text-anchor="end" fill="#555555">Ambiente ilustrativo: a norma exige as áreas livres, não estas dimensões de parede.</text>
</svg>
