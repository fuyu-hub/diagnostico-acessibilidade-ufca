<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Saída de emergência acessível</title><desc id="d">À esquerda, porta de saída de emergência vista de frente, com barra antipânico e vão livre mínimo de 0,80 metro. À direita, dois cortes: um degrau isolado sem rampa bloqueia a saída, o que é incorreto; com rampa junto ao degrau, o percurso fica contínuo, o que é correto.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="30" y="50" width="690" height="640" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5"/><rect x="30" y="690" width="690" height="58" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="186" y="151" width="228" height="539" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5"/><rect x="200" y="165" width="200" height="525" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><rect x="214" y="431" width="172" height="18" rx="6" fill="#444" stroke="#1a1a1a" stroke-width="2"/><rect x="198" y="93" width="204" height="48" rx="4" fill="#15703a" stroke="#1a1a1a" stroke-width="2"/><text x="300" y="127" font-size="28" font-weight="700" text-anchor="middle" fill="#fff" >SAÍDA</text><line x1="386.0" y1="440.0" x2="454" y2="400" stroke="#1a1a1a" stroke-width="1.8" /><text x="460" y="390" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Barra antipânico</text><text x="460" y="419" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Abre com um empurrão</text><line x1="200.0" y1="650.0" x2="400.0" y2="650.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="200.0,650.0 212.0,644.9 212.0,655.1" fill="#1a1a1a"/><polygon points="400.0,650.0 388.0,655.1 388.0,644.9" fill="#1a1a1a"/><text x="440" y="628" font-size="23" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Vão livre</text><text x="440" y="660" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,80 m</text><rect x="760" y="30" width="586" height="330" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="760" y="30" width="586" height="54" rx="10" fill="#b91c1c"/><text x="1053" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Incorreto: degrau sem rampa</text><polygon points="790,230 1040,230 1040,292 1316,292 1316,338 790,338" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="950" y="100" width="12" height="130" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><text x="940" y="130" font-size="21" font-weight="600" text-anchor="end" fill="#1a1a1a" >Porta</text><line x1="806" y1="204" x2="1014" y2="204" stroke="#0b57a4" stroke-width="7"/><path d="M 1014 186 l 36 36 m 0 -36 l -36 36" stroke="#b91c1c" stroke-width="7" stroke-linecap="round"/><text x="1084" y="244" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Degrau isolado</text><rect x="760" y="390" width="586" height="330" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="760" y="390" width="586" height="54" rx="10" fill="#15703a"/><text x="1053" y="427" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Correto: rampa junto ao degrau</text><polygon points="790,590 1040,590 1210,652 1316,652 1316,698 790,698" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><rect x="950" y="460" width="12" height="130" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><text x="940" y="490" font-size="21" font-weight="600" text-anchor="end" fill="#1a1a1a" >Porta</text><polyline points="806,564 1040,564 1210,626 1290,626" fill="none" stroke="#0b57a4" stroke-width="7"/><line x1="1256.0" y1="626.0" x2="1296.0" y2="626.0" stroke="#0b57a4" stroke-width="7"/><polygon points="1296.0,626.0 1277.6,633.8 1277.6,618.2" fill="#0b57a4"/><text x="1150" y="556" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Rampa</text>
