<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Iluminação no balcão de atendimento</title><desc id="d">Duas cenas com um atendente de frente, atrás do balcão. Na correta, o rosto recebe luz uniforme, a boca fica visível e a leitura labial é possível. Na incorreta, uma janela atrás do atendente deixa o rosto na sombra, e a leitura labial fica difícil.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="30" y="30" width="640" height="690" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="30" y="30" width="640" height="54" rx="10" fill="#15703a"/><text x="350" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Correto: rosto bem iluminado</text><rect x="46" y="96" width="608" height="464" fill="#fbf3d4"/><polygon points="300,110 400,110 560,560 140,560" fill="#ffe680" opacity=".7"/><rect x="290" y="96" width="120" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><path d="M 180 560 Q 180 418 350 418 Q 520 418 520 560 Z" fill="#7b8794" stroke="#1a1a1a" stroke-width="3"/><clipPath id="rosto-correto"><circle cx="350" cy="300" r="104"/></clipPath><circle cx="350" cy="300" r="104" fill="#d5d9df" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="312" cy="278" rx="11" ry="13" fill="#222"/><ellipse cx="388" cy="278" rx="11" ry="13" fill="#222"/><path d="M 334 302 q 16 18 24 6" fill="none" stroke="#555" stroke-width="3"/><ellipse cx="350" cy="350" rx="36" ry="17" fill="#555" stroke="#222" stroke-width="2.5"/><rect x="46" y="560" width="608" height="30" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="76" y="590" width="548" height="114" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><text x="350" y="150" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Luz sobre a face</text><line x1="486.0" y1="350.0" x2="398.0" y2="350.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="398.0,350.0 410.9,344.5 410.9,355.5" fill="#1a1a1a"/><text x="492" y="342" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Boca</text><text x="492" y="370" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">visível</text><text x="350" y="640" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >A leitura labial fica possível</text><rect x="706" y="30" width="640" height="690" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="706" y="30" width="640" height="54" rx="10" fill="#b91c1c"/><text x="1026" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Incorreto: rosto na sombra</text><rect x="722" y="96" width="608" height="464" fill="#5a616e"/><rect x="826" y="122" width="400" height="300" fill="#fffbe0" stroke="#1a1a1a" stroke-width="3"/><line x1="1026" y1="122" x2="1026" y2="422" stroke="#1a1a1a" stroke-width="3" /><path d="M 856 560 Q 856 418 1026 418 Q 1196 418 1196 560 Z" fill="#7b8794" stroke="#1a1a1a" stroke-width="3"/><clipPath id="rosto-incorreto"><circle cx="1026" cy="300" r="104"/></clipPath><circle cx="1026" cy="300" r="104" fill="#d5d9df" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="988" cy="278" rx="11" ry="13" fill="#222"/><ellipse cx="1064" cy="278" rx="11" ry="13" fill="#222"/><path d="M 1010 302 q 16 18 24 6" fill="none" stroke="#555" stroke-width="3"/><ellipse cx="1026" cy="350" rx="36" ry="17" fill="#555" stroke="#222" stroke-width="2.5"/><rect x="922" y="196" width="208" height="208" fill="#20242c" opacity=".78" clip-path="url(#rosto-incorreto)"/><rect x="722" y="560" width="608" height="30" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="752" y="590" width="548" height="114" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><text x="1026" y="154" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Janela atrás do atendente</text><line x1="1162.0" y1="350.0" x2="1074.0" y2="350.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="1074.0,350.0 1086.9,344.5 1086.9,355.5" fill="#1a1a1a"/><text x="1168" y="342" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Boca</text><text x="1168" y="370" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">no escuro</text><text x="1026" y="640" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >A leitura labial fica difícil</text>
