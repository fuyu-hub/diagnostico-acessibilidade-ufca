height="690" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="708" y="30" width="628" height="54" rx="10" fill="#b91c1c"/><text x="1022" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Incorreto: jato vertical, atrás</text><rect x="724" y="650" width="596" height="54" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><rect x="724" y="96" width="50" height="554" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><rect x="774" y="440" width="60" height="210" fill="#d0d0d0" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 774 350 H 1054 V 420 Q 1054 440 1034 440 H 774 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="805" y="316" width="18" height="34" rx="4" fill="#666" stroke="#1a1a1a" stroke-width="2"/><path d="M 814 314 V 200" fill="none" stroke="#2f80d0" stroke-width="7" stroke-linecap="round"/><path d="M 884 270 H 940 L 932 350 H 892 Z" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M 892 294 l 40 40 m 0 -40 l -40 40" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><text x="1080" y="170" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Jato vertical</text><text x="1080" y="204" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Não enche o copo</text><text x="1080" y="340" font-size="23" font-weight="600" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Bica longe da frente</text><line x1="1070.0" y1="490.0" x2="1170.0" y2="490.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="1170.0,490.0 1156.2,495.8 1156.2,484.2" fill="#1a1a1a"/><text x="1070" y="530" font-size="22" font-weight="600" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Frente do bebedouro</text>
