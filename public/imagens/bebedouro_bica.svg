<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Bica do bebedouro</title><desc id="d">Dois bebedouros vistos de lado. No correto, a bica fica no lado frontal e tem jato inclinado, que enche um copo. No incorreto, a bica fica longe da frente e o jato é vertical, o que não permite encher o copo.</desc>
