<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Inclinação longitudinal do piso</title><desc id="d">Corredor visto de lado, com a inclinação ampliada para ficar visível e um celular apoiado no piso, alinhado com o sentido da caminhada. A inclinação deve ser inferior a 5 por cento, ou menos de 2,9 graus no celular. A partir de 5 por cento, o trecho deve ser tratado como rampa.</desc>
<rect width="1376" height="768" fill="#fff"/>
<text x="90" y="60" font-size="26" font-weight="700" text-anchor="start" fill="#1a1a1a" >Corredor visto de lado</text><polygon points="90,570 1290,450 1290,690 90,690" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><line x1="90" y1="570" x2="1290" y2="570" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="11 8"/><text x="1246" y="598" font-size="21" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Linha de nível</text><text x="1246" y="540" font-size="22" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Subida</text><line x1="1260.0" y1="570.0" x2="1260.0" y2="453.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="1260.0,570.0 1254.9,558.0 1265.1,558.0" fill="#1a1a1a"/><polygon points="1260.0,453.0 1265.1,465.0 1254.9,465.0" fill="#1a1a1a"/><circle cx="240" cy="317" r="23" fill="#555"/><rect x="216" y="343" width="48" height="112" rx="16" fill="#555"/><rect x="220" y="451" width="17" height="104" fill="#555"/><rect x="243" y="451" width="17" height="104" fill="#555"/><line x1="300.0" y1="445.0" x2="540.0" y2="415.0" stroke="#0b57a4" stroke-width="5"/><polygon points="540.0,415.0 524.4,424.0 522.7,410.1" fill="#0b57a4"/><text x="310" y="387" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Sentido da caminhada</text><g transform="translate(720 507) rotate(-5.710593137499643)"><rect x="-90" y="-16" width="180" height="16" rx="5" fill="#222"/></g><text x="720" y="616" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Celular apoiado no piso</text><text x="720" y="650" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Alinhado com o sentido da caminhada</text><rect x="860" y="70" width="430" height="270" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="882" y="112" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" >Inclinação longitudinal</text><text x="882" y="166" font-size="32" font-weight="700" text-anchor="start" fill="#1a1a1a" >Inferior a 5%</text><text x="882" y="200" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >Menos de 2,9° no celular</text><text x="882" y="246" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >Meça em 3 pontos do percurso</text><text x="882" y="296" font-size="21" font-weight="600" text-anchor="start" fill="#1a1a1a" >A partir de 5%: trate como rampa</text><text x="1290" y="726" font-size="19" text-anchor="end" fill="#555555">Inclinação ampliada para ficar visível.</text>
</svg>
