<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Inclinação transversal do piso</title><desc id="d">Corte de um piso com caimento atravessado, ampliado para ficar visível, com um celular apoiado para medir de um lado ao outro. O limite é de 3 por cento na calçada e na rampa externa, e de 2 por cento no corredor e na rampa interna.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="60" y="60" width="90" height="620" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="150,300 960,390 960,620 150,620" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="3"/><rect x="60" y="620" width="1250" height="60" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="960,500 1300,500 1300,620 960,620" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5"/><line x1="150" y1="300" x2="1020" y2="300" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="11 8"/><line x1="990.0" y1="300.0" x2="990.0" y2="390.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="990.0,300.0 995.1,312.0 984.9,312.0" fill="#1a1a1a"/><polygon points="990.0,390.0 984.9,378.0 995.1,378.0" fill="#1a1a1a"/><text x="1004" y="354" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Caimento</text><text x="166" y="284" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Linha de nível</text><g transform="translate(560 345.55555555555554) rotate(6.340191745909909)"><rect x="-90" y="-16" width="180" height="16" rx="5" fill="#222"/></g><text x="560" y="399.55555555555554" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Celular apoiado no piso</text><line x1="360.0" y1="435.6" x2="760.0" y2="479.6" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="360.0,435.6 374.4,431.3 373.1,442.9" fill="#1a1a1a"/><polygon points="760.0,479.6 745.6,483.9 746.9,472.2" fill="#1a1a1a"/><text x="560" y="509.55555555555554" font-size="23" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Atravessado, de um lado ao outro</text><rect x="910" y="60" width="400" height="196" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="930" y="100" font-size="24" font-weight="700" text-anchor="start" fill="#1a1a1a" >Inclinação transversal</text><text x="930" y="144" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" >Calçada e rampa externa</text><text x="930" y="176" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" >máx. 3%</text><text x="930" y="210" font-size="20" font-weight="500" text-anchor="start" fill="#1a1a1a" >Corredor e rampa interna</text><text x="930" y="242" font-size="27" font-weight="700" text-anchor="start" fill="#1a1a1a" >máx. 2%</text><text x="1310" y="722" font-size="19" text-anchor="end" fill="#555555">Inclinação ampliada para ficar visível.</text>
</svg>
