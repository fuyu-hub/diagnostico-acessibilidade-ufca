<title id="t">Passagem acessível na catraca</title><desc id="d">Vista de cima de um controle de acesso. As catracas comuns não dão passagem à cadeira de rodas. Ao menos uma passagem tem vão livre mínimo de 0,80 metro e espaço de manobra antes e depois.</desc>
