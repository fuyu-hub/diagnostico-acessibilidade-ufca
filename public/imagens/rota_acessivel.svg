<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Rota acessível na escola</title><desc id="d">Planta esquemática de uma escola. A entrada fica na via de menor fluxo de veículos. Uma rota contínua, sem degraus isolados, liga o portão às salas, à biblioteca, ao auditório, à administração, ao refeitório, ao sanitário acessível e à quadra. Degraus precisam de rampa ou equipamento ao lado, e outros pavimentos, de pelo menos duas formas de circulação. O sanitário acessível fica a até 50 metros de qualquer ponto.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="30" y="30" width="1316" height="620" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5"/><rect x="30" y="650" width="1316" height="90" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.5"/><text x="760" y="704" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Entrada na via de menor fluxo de veículos</text><rect x="240" y="270" width="900" height="120" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/><rect x="260" y="80" width="200" height="190" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="360" y="169" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Salas e</text><text x="360" y="199" font-size="23" font-weight="500" text-anchor="middle" fill="#1a1a1a" >laboratórios</text><rect x="480" y="80" width="200" height="190" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="580" y="184" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Biblioteca</text><rect x="700" y="80" width="200" height="190" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="800" y="184" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Auditório</text><rect x="920" y="80" width="200" height="190" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="1020" y="154" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Outro pavimento</text><text x="1020" y="184" font-size="23" font-weight="500" text-anchor="middle" fill="#1a1a1a" >escada + rampa</text><text x="1020" y="214" font-size="23" font-weight="500" text-anchor="middle" fill="#1a1a1a" >ou elevador</text><rect x="260" y="390" width="200" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="360" y="474" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Administração</text><rect x="480" y="390" width="200" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="580" y="474" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Refeitório</text><rect x="700" y="390" width="200" height="150" fill="rgba(11,87,164,.16)" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="800" y="459" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Sanitário</text><text x="800" y="489" font-size="23" font-weight="500" text-anchor="middle" fill="#1a1a1a" >acessível</text><rect x="1160" y="150" width="170" height="360" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="1245" y="324" font-size="23" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Quadra</text><text x="1245" y="354" font-size="23" font-weight="500" text-anchor="middle" fill="#1a1a1a" >e pátio</text><path d="M 150 650 V 330 H 1160" fill="none" stroke="#0b57a4" stroke-width="10" stroke-linejoin="round"/><line x1="1120.0" y1="330.0" x2="1160.0" y2="330.0" stroke="#0b57a4" stroke-width="10"/><polygon points="1160.0,330.0 1137.9,339.3 1137.9,320.7" fill="#0b57a4"/><line x1="360" y1="330" x2="360" y2="270" stroke="#0b57a4" stroke-width="7"/><line x1="580" y1="330" x2="580" y2="270" stroke="#0b57a4" stroke-width="7"/><line x1="800" y1="330" x2="800" y2="270" stroke="#0b57a4" stroke-width="7"/><line x1="1020" y1="330" x2="1020" y2="270" stroke="#0b57a4" stroke-width="7"/><line x1="360" y1="330" x2="360" y2="390" stroke="#0b57a4" stroke-width="7"/><line x1="580" y1="330" x2="580" y2="390" stroke="#0b57a4" stroke-width="7"/><line x1="800" y1="330" x2="800" y2="390" stroke="#0b57a4" stroke-width="7"/><rect x="108" y="636" width="84" height="28" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="150" y="658" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Portão</text><rect x="44" y="80" width="190" height="170" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><rect x="146" y="136" width="70" height="54" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="62,190 146,190 146,136" fill="rgba(11,87,164,.28)" stroke="#0b57a4" stroke-width="3"/><text x="139" y="114" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Degrau só com</text><text x="139" y="214" font-size="17" font-weight="500" text-anchor="middle" fill="#1a1a1a" >rampa ou equipamento</text><text x="139" y="236" font-size="17" font-weight="500" text-anchor="middle" fill="#1a1a1a" >ao lado</text><line x1="800.0" y1="540.0" x2="924" y2="578" stroke="#1a1a1a" stroke-width="1.8" /><text x="930" y="586" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Até 50 m de qualquer ponto</text><text x="245" y="52" font-size="23" font-weight="600" text-anchor="start" fill="#1a1a1a" >Rota contínua, sem degraus isolados e sem barreiras, até todos os ambientes</text>
</svg>
