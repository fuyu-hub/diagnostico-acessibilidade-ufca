roke="#fff" stroke-width="6" stroke-linejoin="round">0,50 m</text><text x="370.8" y="222.50000000000003" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Barra vertical</text><text x="370.8" y="250.50000000000003" font-size="22" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">mín. 0,70 m</text><line x1="382.8" y1="435.5" x2="382.8" y2="409.5" stroke="#1a1a1a" stroke-width="2"/><polygon points="382.8,435.5 380.1,429.1 385.5,429.1" fill="#1a1a1a"/><polygon points="382.8,409.5 385.5,415.9 380.1,415.9" fill="#1a1a1a"/><line x1="362.8" y1="409.5" x2="394.8" y2="409.5" stroke="#1a1a1a" stroke-width="1.4" /><text x="396.8" y="429.5" font-size="21" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,10 m</text><line x1="257.8" y1="160.5" x2="356.8" y2="160.5" stroke="#1a1a1a" stroke-width="2"/><polygon points="257.8,160.5 266.1,157.0 266.1,164.0" fill="#1a1a1a"/><polygon points="356.8,160.5 348.5,164.0 348.5,157.0" fill="#1a1a1a"/><line x1="257.8" y1="148.50000000000003" x2="257.8" y2="541.5" stroke="#1a1a1a" stroke-width="1.6" /><text x="247.8" y="170.50000000000003" font-size="22" font-weight="700" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">0,30 m</text><rect x="700" y="30" width="646" height="660" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="700" y="30" width="36" height="660" fill="#d8d8d8" stroke="#1a1a1a" stroke-width="2.5"/><rect x="700" y="690" width="646" height="58" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><text x="754" y="68" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Parede do fundo</text><line x1="868" y1="90" x2="868" y2="690" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="14 7 3 7"/><rec