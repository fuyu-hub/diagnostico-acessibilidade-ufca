<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Mapa tátil da rota de fuga</title><desc id="d">À esquerda, parede de uma sala com um mapa ao lado da porta. À direita, o mapa ampliado mostra a rota de fuga até a saída, em formato visual, com cores e textos, e tátil, com paredes e rota em relevo e Braille. O mapa deve existir em salas de aula, laboratórios e auditório.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="30" y="60" width="430" height="630" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2.5"/><rect x="30" y="690" width="430" height="58" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2.5"/><text x="245" y="104" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Parede da sala</text><rect x="70" y="190" width="170" height="500" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" /><circle cx="218" cy="450" r="9" fill="#444"/><rect x="290" y="330" width="130" height="92" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><rect x="302" y="342" width="106" height="68" fill="none" stroke="#555555" stroke-width="2"/><path d="M 314 396 H 366 V 358 H 396" fill="none" stroke="#0b57a4" stroke-width="4"/><line x1="420" y1="330" x2="520" y2="120" stroke="#1a1a1a" stroke-width="1.8" /><line x1="420" y1="422" x2="520" y2="630" stroke="#1a1a1a" stroke-width="1.8" /><rect x="520" y="60" width="826" height="630" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><text x="933" y="104" font-size="26" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Mapa da rota de fuga (ampliado)</text><rect x="560" y="136" width="500" height="400" fill="#eef1f4" stroke="#1a1a1a" stroke-width="7"/><path d="M 560 286 H 750 M 840 286 H 1060" fill="none" stroke="#1a1a1a" stroke-width="7"/><path d="M 560 396 H 890 M 980 396 H 1060" fill="none" stroke="#1a1a1a" stroke-width="7"/><path d="M 730 136 V 286 M 900 136 V 286" fill="none" stroke="#1a1a1a" stroke-width="7"/><path d="M 810 396 V 536" fill="none" stroke="#1a1a1a" stroke-width="7"/><polyline points="645,216 795,216 795,341 935,341 935,466 1030,466" fill="none" stroke="#0b57a4" stroke-width="8" stroke-dasharray="2 16" stroke-linecap="round"/><line x1="1000.0" y1="466.0" x2="1056.0" y2="466.0" stroke="#0b57a4" stroke-width="6"/><polygon points="1056.0,466.0 1037.6,473.8 1037.6,458.2" fill="#0b57a4"/><circle cx="645" cy="216" r="17" fill="#b91c1c" stroke="#1a1a1a" stroke-width="2.5"/><rect x="994" y="482" width="62" height="34" rx="4" fill="#15703a"/><text x="1025" y="506" font-size="19" font-weight="700" text-anchor="middle" fill="#fff" >Saída</text><text x="645" y="260" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Você está aqui</text><text x="1088" y="166" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Visual</text><text x="1088" y="196" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >Cores e textos</text><text x="1088" y="222" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >de leitura fácil</text><text x="1088" y="296" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Tátil</text><text x="1088" y="326" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >Paredes e rota</text><text x="1088" y="352" font-size="21" font-weight="500" text-anchor="start" fill="#1a1a1a" >em relevo</text><circle cx="1094" cy="398" r="5" fill="#1a1a1a"/><circle cx="1109" cy="398" r="5" fill="#1a1a1a"/><circle cx="1109" cy="413" r="5" fill="#1a1a1a"/><circle cx="1138" cy="398" r="5" fill="#1a1a1a"/><circle cx="1138" cy="413" r="5" fill="#1a1a1a"/><circle cx="1138" cy="428" r="5" fill="#1a1a1a"/><circle cx="1182" cy="398" r="5" fill="#1a1a1a"/><circle cx="1197" cy="398" r="5" fill="#1a1a1a"/><circle cx="1182" cy="413" r="5" fill="#1a1a1a"/><circle cx="1226" cy="398" r="5" fill="#1a1a1a"/><circle cx="1241" cy="413" r="5" fill="#1a1a1a"/><circle cx="1226" cy="428" r="5" fill="#1a1a1a"/><text x="1088" y="470" font-size="25" font-weight="700" text-anchor="start" fill="#1a1a1a" >Braille</text><text x="933" y="650" font-size="19" text-anchor="middle" fill="#555555">Planta e pontos em Braille meramente ilustrativos.</text><text x="245" y="148" font-size="21" font-weight="500" text-anchor="middle" fill="#1a1a1a" >Em salas, laboratórios</text><text x="245" y="174" font-size="21" font-weight="500" text-anchor="middle" fill="#1a1a1a" >e auditório</text>
