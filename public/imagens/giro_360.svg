<title id="t">Área de giro de 360 graus</title><desc id="d">Vista de cima de uma cadeira de rodas dentro de uma área circular livre com diâmetro mínimo de 1,50 metro, ao lado de uma carteira, que deve estar distribuída pela sala sem segregar a pessoa.</desc>
<rect width="1376" height="768" fill="#fff"/>
<circle cx="500" cy="400" r="300" fill="rgba(11,87,164,.14)" stroke="#0b57a4" stroke-width="4" stroke-dasharray="14 9"/><g transform="translate(500 400) rotate(0) scale(1.15)" opacity="1">
    <rect x="-46" y="-48" width="92" height="96" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="-40" y="-64" width="66" height="16" rx="7" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-40" y="48" width="66" height="16" rx="7" fill="#444" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-58" y="-36" width="12" height="72" rx="5" fill="#777" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="-4" cy="0" r="24" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="46" y="-30" width="34" height="60" rx="8" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2.5"/>
  </g><path d="M 690 400 A 190 190 0 1 1 500 210" fill="none" stroke="#0b57a4" stroke-width="6"/><line x1="482.0" y1="204.0" x2="500.0" y2="210.0" stroke="#0b57a4" stroke-width="6"/><polygon points="500.0,210.0 478.1,211.7 483.5,195.5" fill="#0b57a4"/><line x1="200.0" y1="738.0" x2="800.0" y2="738.0" stroke="#1a1a1a" stroke-width="3.5"/><polygon points="200.0,738.0 212.0,732.9 212.0,743.1" fill="#1a1a1a"/><polygon points="800.0,738.0 788.0,743.1 788.0,732.9" fill="#1a1a1a"/><line x1="200" y1="400" x2="200" y2="750" stroke="#1a1a1a" stroke-width="1.6" /><line x1="800" y1="400" x2="800" y2="750" stroke="#1a1a1a" stroke-width="1.6" /><text x="500" y="726" font-size="27" font-weight="700" text-anchor="middle" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Diâmetro mínimo: 1,50 m</text><rect x="830" y="290" width="200" height="220" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="930" y="409" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Carteira</text><text x="842" y="170" font-size="28" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Área de giro de 360°</text><text x="842" y="204" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Junto à carteira, livre de obstáculos</text><text x="842" y="590" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Carteira distribuída pela sala,</text><text x="842" y="620" font-size="22" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">sem segregar quem usa cadeira</text>
