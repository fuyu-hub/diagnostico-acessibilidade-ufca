<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Contraste na entrada do elevador</title><desc id="d">À esquerda, duas paredes com porta de elevador: a porta escura em parede clara contrasta e está correta; a porta cinza em parede cinza não contrasta e está incorreta. À direita, vista de cima: o piso da cabina é duro, antiderrapante e contrasta com o piso do pavimento, sem contar a soleira.</desc>
