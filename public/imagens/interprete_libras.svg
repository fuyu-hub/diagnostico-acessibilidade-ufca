<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="t d" font-family="Inter, Arial, Helvetica, sans-serif">
<title id="t">Local do intérprete de Libras</title><desc id="d">Duas cenas com um intérprete de Libras. Na correta, o local é identificado com o símbolo de pessoas com deficiência auditiva, a iluminação é direcional e a pessoa fica visível da cabeça aos joelhos, sem sombra no fundo. Na incorreta, não há identificação, a luz lateral projeta sombra no fundo e um móvel encobre as pernas.</desc>
<rect width="1376" height="768" fill="#fff"/>
<rect x="30" y="30" width="640" height="690" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="30" y="30" width="640" height="54" rx="10" fill="#15703a"/><text x="350" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Correto: visível e sem sombra</text><clipPath id="palco-correto"><rect x="46" y="96" width="608" height="534"/></clipPath><rect x="46" y="96" width="608" height="534" fill="#f2f2f2"/><rect x="46" y="630" width="608" height="74" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><polygon points="258,108 302,108 430,630 130,630" fill="#ffe680" opacity=".75" clip-path="url(#palco-correto)"/><rect x="246" y="96" width="68" height="14" fill="#333"/><circle cx="280" cy="300" r="34" fill="#444"/><rect x="238" y="340" width="84" height="150" rx="22" fill="#444"/><rect x="244" y="482" width="30" height="148" fill="#444"/><rect x="286" y="482" width="30" height="148" fill="#444"/><path d="M 242 362 L 188 410 L 234 340 M 318 362 L 372 410 L 326 340" fill="none" stroke="#444" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><line x1="430.0" y1="266.0" x2="430.0" y2="550.0" stroke="#1a1a1a" stroke-width="3"/><polygon points="430.0,266.0 435.1,278.0 424.9,278.0" fill="#1a1a1a"/><polygon points="430.0,550.0 424.9,538.0 435.1,538.0" fill="#1a1a1a"/><line x1="320" y1="266" x2="444" y2="266" stroke="#1a1a1a" stroke-width="1.6" /><line x1="320" y1="550" x2="444" y2="550" stroke="#1a1a1a" stroke-width="1.6" /><text x="444" y="400" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Da cabeça</text><text x="444" y="428" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">aos joelhos</text><text x="370" y="150" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Iluminação direcional</text><g transform="translate(74 130) scale(1.9444444444444444)"><rect width="36" height="36" rx="4" fill="#0b57a4"/><path d="M 13 21 C 8 9 27 5 27 16 C 27 22 20 21 20 27 a 4 4 0 0 1 -7 2" fill="none" stroke="#fff" stroke-width="2.6"/><line x1="8" y1="30" x2="29" y2="7" stroke="#fff" stroke-width="2.6"/></g><text x="74" y="228" font-size="21" font-weight="600" text-anchor="start" fill="#1a1a1a" >Local</text><text x="74" y="254" font-size="21" font-weight="600" text-anchor="start" fill="#1a1a1a" >identificado</text><rect x="706" y="30" width="640" height="690" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="706" y="30" width="640" height="54" rx="10" fill="#b91c1c"/><text x="1026" y="67" font-size="25" font-weight="700" text-anchor="middle" fill="#fff" >Incorreto: sombra e pernas encobertas</text><clipPath id="palco-incorreto"><rect x="722" y="96" width="608" height="534"/></clipPath><rect x="722" y="96" width="608" height="534" fill="#f2f2f2"/><rect x="722" y="630" width="608" height="74" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="2"/><polygon points="742,246 742,278 956,470 956,230" fill="#ffe680" opacity=".75"/><rect x="722" y="240" width="20" height="44" fill="#333"/><g transform="translate(150 -6) skewX(-4)" opacity=".9"><circle cx="956" cy="300" r="34" fill="#8d8d94"/><rect x="914" y="340" width="84" height="150" rx="22" fill="#8d8d94"/><rect x="920" y="482" width="30" height="148" fill="#8d8d94"/><rect x="962" y="482" width="30" height="148" fill="#8d8d94"/><path d="M 918 362 L 864 410 L 910 340 M 994 362 L 1048 410 L 1002 340" fill="none" stroke="#8d8d94" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="956" cy="300" r="34" fill="#444"/><rect x="914" y="340" width="84" height="150" rx="22" fill="#444"/><rect x="920" y="482" width="30" height="148" fill="#444"/><rect x="962" y="482" width="30" height="148" fill="#444"/><path d="M 918 362 L 864 410 L 910 340 M 994 362 L 1