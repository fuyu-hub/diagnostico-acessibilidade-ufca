ll="#fca5a5" stroke="#b91c1c" stroke-width="3"/><text x="1004" y="246.8" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a1a" >Placa</text><text x="1080" y="368" font-size="27" font-weight="700" text-anchor="end" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Incorreto</text><text x="1080" y="398" font-size="21" font-weight="500" text-anchor="end" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Invade o espaço livre</text><text x="1198" y="290" font-size="23" font-weight="700" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">Confira:</text><text x="1198" y="322" font-size="19" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">galhos</text><text x="1198" y="350" font-size="19" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">placas</text><text x="1198" y="378" font-size="19" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">toldos</text><text x="1198" y="406" font-size="19" font-weight="500" text-anchor="start" fill="#1a1a1a" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">ar-condicionado</text>
