<title id="t">Altura livre sobre o caminho</title><desc id="d">Vista lateral de um caminho com altura livre mínima de 2,10 metros. Galhos acima desse limite estão corretos. Uma placa abaixo dele invade o espaço livre e está incorreta. Também devem ser conferidos toldos e aparelhos de ar-condicionado.</desc>
