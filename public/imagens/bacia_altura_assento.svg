<title id="t">Altura da bacia e assento</title><desc id="d">À esquerda, bacia sanitária vista de lado, com altura entre 0,43 e 0,46 metro com assento, e entre 0,43 e 0,45 metro sem assento. À direita, dois assentos vistos de cima: o correto não tem abertura frontal, e o incorreto tem.</desc>
