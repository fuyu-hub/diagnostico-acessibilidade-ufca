<title id="t">Entrada ao lado da porta giratória</title><desc id="d">Vista de cima de uma fachada. A porta giratória não dá passagem à cadeira de rodas. Ao lado dela há uma entrada acessível, que fica aberta durante o funcionamento e por onde a cadeira passa.</desc>
